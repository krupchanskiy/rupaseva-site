><button type="button" class="hm-burg" aria-label="Меню" data-burg><i></i><i></i></button></div></div><div class="hm-mob" data-mob><nav><a href="/#retreats" data-mob-x>Ретриты</a><a href="/#temple" data-mob-x>Храм</a><a href="/#ashram" data-mob-x>Ашрам</a><a href="/#groups" data-mob-x>Для групп</a><a href="/#seva" data-mob-x>Наше служение</a><a href="/join" data-mob-x>Участие</a><a href="/contacts" data-mob-x>Контакты</a></nav><div class="hm-mob-c"><a class="btn " href="https://wa.me/79250077575" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5l1.4-4A7.5 7.5 0 1 1 8.6 19z"/><path d="M9 10.5h6M9 13.5h4"/></svg>WhatsApp</a><a class="btn " href="https://t.me/+79250077575" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4L3 11l6.5 2.5L12 20l3-5 4.5 3z"/><path d="M9.5 13.5L21 4"/></svg>Telegram</a><a class="btn " href="mailto:info@rupaseva.ru"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 6.5l8.5 7 8.5-7"/></svg>Email</a></div></div></header><main><section class="s-hero gi-hero"><div class="wrap s-hero-g"><div class="s-hero-t rv"><p class="eb"><i></i>Ашрам · шесть кутиров</p><h1 class="caps">Госвами<br>Вриндавана</h1><p class="lead">Спутники Шри Чайтаньи Махапрабху, великие ачарьи, защитники преданных.</p></div><figure class="s-hero-ph gi-hero-ph rv"><button type="button" class="gi-ph " data-lb="0" aria-label="Кутир одного из Госвами — открыть"><img src="/images/groups/568152cf3c86237fe0e079b2f7de4915.jpg" alt="Кутир одного из Госвами" loading="lazy"></button></figure></div><div class="wrap"><ul class="s-facts rv"><li><b>6 кутиров</b><span>из земли Враджа</span></li><li><b>7 мурти</b><span>шесть Госвами и Шрила Прабхупада</span></li><li><b>Утром</b><span>Госвами будят и проводят пуджу</span></li><li><b>Вечером</b><span>поют бхаджаны и укладывают спать</span></li></ul></div></section><section class="sec gs-vs"><div class="wrap gs-vs-in rv"><p class="gs-sk">ванде рӯпа-санāтанау рагху-йугау<br>шрӣ-джӣва-гопāлакау</p><p class="gs-tr">«Я в почтении склоняюсь перед Шри Рупой, Шри Санатаной, Шри Рагхунатхой дасом и Шри Рагхунатхой Бхаттой, Шри Дживой и Шри Гопалом Бхаттой».</p><p class="gs-p">Госвами Вриндавана — спутники Шри Чайтаньи Махапрабху, которым Он поручил открыть миру науку враджа-бхакти. Медитация на их образы, качества и деяния — авторитетная практика, рекомендованная священными писаниями и нашими учителями.</p></div></section><section class="sec gs-ni gs-au" id="kutirs" data-ap data-ap-base="/audio/goswami/" data-ap-def="ru"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>Аудиобиографии</p><h2 class="caps">Кутиры<br>Госвами</h2></div><div><p class="lead">Мы хотели бы помочь каждому развивать личные отношения с каждым из этих великих вайшнавов. Для этого мы построили из земли Враджа шесть кутиров и пригласили в каждый мурти одного из Госвами.</p><p class="au-lead2">В каждом кутире звучит аудиобиография его Госвами. Теперь её можно послушать и здесь.</p></div></div><div class="gs-ng bp-g"><div class="gs-face rv"><figure class="on" data-vf-i="0"><span><img src="/images/groups/c68f4da1276fd6e48e09a4144eaab98c.jpg" alt="Шрила Рупа Госвами" loading="lazy"></span><figcaption>Шрила Рупа Госвами</figcaption></figure><figure class="" data-vf-i="1"><span><img src="/images/groups/8b073cc8a48e22523752963b6d43fb0b.jpg" alt="Шрила Санатана Госвами" loading="lazy"></span><figcaption>Шрила Санатана Госвами</figcaption></figure><figure class="" data-vf-i="2"><span><img src="/images/groups/b6cdfed36193bed385f514e9fef4174a.jpg" alt="Шрила Рагхунатха дас Госвами" loading="lazy"></span><figcaption>Шрила Рагхунатха дас Госвами</figcaption></figure><figure class="" data-vf-i="3"><span><img src="/images/groups/2c06b8c96c90ca9b284cee86c71737d5.jpg" alt="Шрила Рагхунатха Бхатта Госвами" loading="lazy"></span><figcaption>Шрила Рагхунатха Бхатта Госвами</figcaption></figure><figure class="" data-vf-i="4"><span><img src="/images/groups/4ba5d6a2706a83d404624e4d0b448553.jpg" alt="Шрила Джива Госвами" loading="lazy"></span><figcaption>Шрила Джива Госвами</figcaption></figure><figure class="" data-vf-i="5"><span><img src="/images/groups/01b15af54a4d2b3c1de31a7afc381928.jpg" alt="Шрила Гопал Бхатта Госвами" loading="lazy"></span><figcaption>Шрила Гопал Бхатта Госвами</figcaption></figure></div><div class="bp-r rv"><div class="bp-h"><span class="bp-h-t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="6.5" rx="1.6"/><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.6"/></svg>Шесть голосов из кутиров</span><span class="ap-lang" role="group" aria-label="Язык записи"><button type="button" data-ap-lang="ru">RU</button><button type="button" data-ap-lang="en">EN</button></span></div><ol class="bp-l"><li><button type="button" class="bp-it" data-ap-i="0" data-ap-play="0" data-vf-t="0" data-src="rupa" data-d-ru="491" data-d-en="525"><span class="bp-n">01</span><span class="bp-th"><img src="/images/groups/a3d486051a97a9def9efa4572a69d078.jpg" alt="" loading="lazy"></span><span class="bp-tx"><b>Рупа Госвами</b><small><span data-ap-dur>8</span> <span data-ap-unit>мин</span></small><span class="bp-pr"><i></i></span></span><span class="bp-pp"><svg class="ap-ic-pl" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l9.6-6.2a.8.8 0 0 0 0-1.4L9.7 5.1a.8.8 0 0 0-1.2.7z" fill="currentColor"/></svg><svg class="ap-ic-pa" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" ata-d-ru="507" data-d-en="593"><span class="bp-n">04</span><span class="bp-th"><img src="/images/groups/c085d1bd489f7c33d3df311544f89d73.jpg" alt="" loading="lazy"></span><span class="bp-tx"><b>Рагхунатха Бхатта Госвами</b><small><span data-ap-dur>8</span> <span data-ap-unit>мин</span></small><span class="bp-pr"><i></i></span></span><span class="bp-pp"><svg class="ap-ic-pl" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l9.6-6.2a.8.8 0 0 0 0-1.4L9.7 5.1a.8.8 0 0 0-1.2.7z" fill="currentColor"/></svg><svg class="ap-ic-pa" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg></span></button></li><li><button type="button" class="bp-it" data-ap-i="4" data-ap-play="4" data-vf-t="4" data-src="jiva" data-d-ru="519" data-d-en="562"><span class="bp-n">05</span><span class="bp-th"><img src="/images/groups/7c8a4ae665017bdc326bcf369bc27460.jpg" alt="" loading="lazy"></span><span class="bp-tx"><b>Джива Госвами</b><small><span data-ap-dur>9</span> <span data-ap-unit>мин</span></small><span class="bp-pr"><i></i></span></span><span class="bp-pp"><svg class="ap-ic-pl" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l9.6-6.2a.8.8 0 0 0 0-1.4L9.7 5.1a.8.8 0 0 0-1.2.7z" fill="currentColor"/></svg><svg class="ap-ic-pa" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg></span></button></li><li><button type="button" class="bp-it" data-ap-i="5" data-ap-play="5" data-vf-t="5" data-src="gopal-bhatta" data-d-ru="637" data-d-en="672"><span class="bp-n">06</span><span class="bp-th"><img src="/images/groups/4224110d50ca4d7b355e73778dddae46.jpg" alt="" loading="lazy"></span><span class="bp-tx"><b>Гопал Бхатта Госвами</b><small><span data-ap-dur>11</span> <span data-ap-unit>мин</span></small><span class="bp-pr"><i></i></span></span><span class="bp-pp"><svg class="ap-ic-pl" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l9.6-6.2a.8.8 0 0 0 0-1.4L9.7 5.1a.8.8 0 0 0-1.2.7z" fill="currentColor"/></svg><svg class="ap-ic-pa" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg></span></button></li></ol><p class="bp-note">Шрила Прабхупада тоже живёт в нашем кутире — запись о нём готовится.</p></div></div></div><div class="bp-mini" aria-live="polite"><span class="bp-mini-th"><img data-ap-thumb src="/images/groups/a3d486051a97a9def9efa4572a69d078.jpg" alt=""></span><span class="bp-mini-tx"><small>Сейчас звучит</small><b data-ap-name>Рупа Госвами</b></span><span class="bp-mini-tm"><span data-ap-t>0:00</span> / <span data-ap-d>0:00</span></span><button type="button" class="bp-mini-pp" data-ap-toggle aria-label="Пауза или продолжить"><svg class="ap-ic-pl" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l9.6-6.2a.8.8 0 0 0 0-1.4L9.7 5.1a.8.8 0 0 0-1.2.7z" fill="currentColor"/></svg><svg class="ap-ic-pa" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg></button><button type="button" class="bp-mini-x" data-ap-stop aria-label="Остановить">×</button><span class="bp-mini-p"><i></i></span></div></section><section class="sec gs-how"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>Как проявлялись мурти</p><h2 class="caps">Долгий путь<br>к образам Госвами</h2></div><div><p class="lead">Мы прошли очень долгий путь, который начался с обсуждения каждого мурти и создания многочисленных эскизов.</p></div></div><div class="gs-tb" data-tabs><ol class="gs-tl"><li><button type="button" class="on" data-tab="0"><span>01</span>Эскизы</button></li><li><button type="button" class="" data-tab="1"><span>02</span>Ни одного достоверного изображения</button></li><li><button type="button" class="" data-tab="2"><span>03</span>Мастерская в Удджейне</button></li><li><button type="button" class="" data-tab="3"><span>04</span>Знаки на ладонях</button></li></ol><div class="gs-tp"><div class="gs-pn on" data-pane="0"><p>Работе помогало то, что один из проектов нашей команды — многосерийный фильм <a href="/shad-gosvami">«Шад Госвами»</a>, подробное описание жизни Госвами Вриндавана. Но если об их деяниях многое известно, то как понять, как они выглядели?</p><div class="gs-pp gs-pp3"><button type="button" class="gi-ph " data-lb="1" aria-label="Эскизы — открыть"><img src="/images/groups/115acb846331311744eaa58413c4b794.jpg" alt="Эскизы" loading="lazy"></button><button type="button" class="gi-ph " data-lb="2" aria-label="Эскизы — открыть"><img src="/images/groups/394f20e2ed1705bf48ce27e832a7a9b0.jpg" alt="Эскизы" loading="lazy"></button><button type="button" class="gi-ph " data-lb="3" aria-label="Эскизы — открыть"><img src="/images/groups/cd2920a5358e470ea22b30e1439ae80f.jpg" alt="Эскизы" loading="lazy"></button></div></div><div class="gs-pn" data-pane="1"><p>Есть мнение, что это единственное сохранившееся прижизненное изображение Шрилы Рупы Госвами. Но, <a href="https://www.isvara.org/archive/rup-and-jadrup/" target="_blank" rel="noopener">как выяснилось</a>, это некий Джадруп, аскет из Удджейна, приближённый императора Джахангира, родившегося уже после ухода Шрилы Рупы Госвами. Таким образом, у нас нет достоверных изображений никого из шести Госвами.</p><div class="gs-pp gs-pp1"><button type="button" class="gi-ph " data-lb="4" aria-label="Ни одного достоверного изображения — открыть"><img src="/images/groups/46924ec10f5b016a7a10ab1586a43667.jpg" alt="Ни одного достоверного изображения" loading="lazy"></button></div></div><div class="gs-pn" data-pane="2"><p>Нам предстояла очень интересная работа с командой скульпторов, чья мастерская находится в храме ИСККОН в священном городе Удджейн. Много месяцев мы вместе проявляли эти формы, молясь о том, чтобы Госвами приняли наши усилия и проявились в этих мурти.</p><div class="gs-pp gs-pp4"><button type="button" class="gi-ph " data-lb="5" aria-label="Мастерская в Удджейне — открыть"><img src="/images/groups/0516355b23a12ae410fe698c2ec90d30.jpg" alt="Мастерская в Удджейне" loading="lazy"></button><button type="button" class="gi-ph " data-lb="6" aria-label="Мастерская в Удджейне — открыть"><img src="/images/groups/608217b661e65054dfc1ea3a2a461e50.jpg" alt="Мастерская в Удджейне" loading="lazy"></button><button type="button" class="gi-ph " data-lb="7" aria-label="Мастерская в Удджейне — открыть"><img src="/images/groups/cd1b9c0ae7b002a995768ef2cf12bf51.jpg" alt="Мастерская в Удджейне" loading="lazy"></button><button type="button" class="gi-ph " data-lb="8" aria-label="Мастерская в Удджейне — открыть"><img src="/images/groups/cdd5fd981f4694de24bd4e2cd0250f76.jpg" alt="Мастерская в Удджейне" loading="lazy"></button></div></div><div class="gs-pn" data-pane="3"><p>Мы уделили много внимания деталям. Например, линии на руках Госвами полностью соответствуют описаниям знаков на руках маха-пуруш, великих личностей, приведённым в книгах по самудрика-шастре (ведической хиромантии).</p><div class="gs-pp gs-pp1"><button type="button" class="gi-ph " data-lb="9" aria-label="Знаки на ладонях — открыть"><img src="/images/groups/3125b93c4c29bc14fa276405d60e4b4c.jpg" alt="Знаки на ладонях" loading="lazy"></button></div></div></div></div></div></section><section class="sec gs-mini"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>Только в Шри Рупа Сева Кундже</p><h2 class="caps">Мурти Госвами<br>для вашего алтаря</h2></div><div><p class="lead">Мы делаем маленькие мурти Госвами. Каждую расписывают вручную, а хранят в деревянном футляре.</p><p class="gs-mp">Приобрести их можно только у нас — во время ретрита или заранее, написав нам.</p><div class="gs-mb"><a class="btn btn-ghost" href="https://wa.me/79250077575" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5l1.4-4A7.5 7.5 0 1 1 8.6 19z"/><path d="M9 10.5h6M9 13.5h4"/></svg>WhatsApp</a><a class="btn btn-ghost" href="https://t.me/+79250077575" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4L3 11l6.5 2.5L12 20l3-5 4.5 3z"/><path d="M9.5 13.5L21 4"/></svg>Telegram</a><a class="btn btn-ghost" href="mailto:info@rupaseva.ru"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 6.5l8.5 7 8.5-7"/></svg>Email</a></div></div></div><div class="gs-mg rv"><button type="button" class="gi-ph gs-big" data-lb="10" aria-label="Маленькие мурти Госвами — открыть"><img src="/images/groups/90c2989ab2e8cca136cdd6cef3c9af75.jpg" alt="Маленькие мурти Госвами" loading="lazy"></button><button type="button" class="gi-ph " data-lb="11" aria-label="Роспись мурти — открыть"><img src="/images/groups/f0434a921a71131643d687361ee99879.jpg" alt="Роспись мурти" loading="lazy"></button><button type="button" class="gi-ph " data-lb="12" aria-label="Мурти на подставках — открыть"><img src="/images/groups/9b209119f223ea693548833777c22b60.jpg" alt="Мурти на подставках" loading="lazy"></button><button type="button" class="gi-ph " data-lb="13" aria-label="Футляр «Шад-Госвами» — открыть"><img src="/images/groups/78b84d4f24f63c91f97230937d487e20.jpg" alt="Футляр «Шад-Госвами»" loading="lazy"></button><button type="button" class="gi-ph " data-lb="14" aria-label="Футляр с гравировкой — открыть"><img src="/images/groups/0470ed66033ef81f087a527c
