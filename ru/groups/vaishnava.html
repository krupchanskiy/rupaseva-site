.sv-grid{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(250px,auto));margin-top:72px;border-top:1px solid var(--line);border-left:1px solid var(--line);isolation:isolate}

<section class="sec vf" id="founder"><div class="wrap"><div class="vf-paper"><button type="button" class="vf-bub" data-video="/videos/groups/bvgm-ru-1080.mp4" data-poster="/images/groups/3e60b9d62a0a4858bd586e1b49dfda0c.jpg" aria-label="Видео: Шрила Бхакти Вигьяна Госвами об ашраме"><img src="/images/groups/9a05b17cafb7b5cc1225b58f649697fd.jpg" alt="" loading="lazy" decoding="async"><span class="vf-ring"></span><span class="vf-play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg></span></button><p class="eyebrow"><i></i>Идея и духовное руководство</p><h2 class="caps">Ашрам Шрилы<br>Бхакти Вигьяны Госвами</h2><div class="vf-letter"><p>Всё началось с наставления Шрилы Бхакти Вигьяны Госвами: создать во Врадже место, полностью сосредоточенное на преданном служении. Место, где будут тишина и деревья, вдохновляющий Бхагаватам и глубокие киртаны, служение вайшнавам и коровам.</p><p>Теперь мы хотим, чтобы каждая группа, которая приезжает сюда, почувствовала то, ради чего всё это затевалось: простую и прекрасную жизнь в сознании Кришны у подножия Шри Гирираджа.</p></div><div class="vf-sign">Команда Шри Рупа Сева Кунджи</div><p class="vf-h">Принципы ашрама</p><div class="vf-seals"><div class="vf-seal"><b>Служение — основа всего</b></div><div class="vf-seal"><b>Некоммерческий проект</b></div><div class="vf-seal"><b>Одни правила для всех</b></div><div class="vf-seal"><b>Камерность</b></div><div class="vf-seal"><b>Красота во всём</b></div></div><div class="vf-links"><span>Подробнее на сайте ашрама</span><a href="/">Сайт ашрама<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a><a href="/forest">Деревья Вриндавана<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></ <section class="sec gr" id="worship"><div class="wrap"><div class="g12 head"><div class="t"><p class="eyebrow"><i></i>Поклонение</p><h2 class="caps">Сердце <br>ашрама</h2></div><div class="body"><p class="lead-it">Шри Гирирадж в центре кунджи, шесть Госвами в глиняных кутирах и Шрила Прабхупада.</p></div></div><div class="wr-sub"><h3 class="wr-h">Шри Гирирадж</h3><p class="wr-l">Он пришёл к нам раньше забора, воды и электричества. По традиции — «автостопом».</p></div></div><div class="gr-path"><svg class="gr-trail" viewBox="0 0 1000 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 22 C120 6 220 36 340 20 S560 4 680 22 S880 36 1000 16"/></svg><span class="gr-dot"></span></div><div class="gr-track" data-gr><article class="gr-st"><div class="gr-ph"><img src="/images/groups/59f72d147df0915c4ce0cf2b5c189cc2.jpg" alt="" loading="lazy" draggable="false"></div><span class="gr-n">01</span><h3>Гости на участке</h3><p>Друг позвонил нам в Москву: «У нас на участке гости». У дороги лежала большая Говардхана-шила — и с Ней около сотни малых шил.</p></article><article class="gr-st"><div class="gr-ph"><img src="/images/groups/15ce95e95881281f8931e6ea40273c15.jpg" alt="" loading="lazy" draggable="false"></div><span class="gr-n">02</span><h3>Первая пуджа</h3><p>Мы перенесли Гирираджа в центр участка и провели пуджу. Незнакомый местный мальчик поставил Ему тилаку.</p></article><article class="gr-st"><div class="gr-ph"><img src="/images/groups/b05c665f3a0e6c749d069281e318e934.jpg" alt="" loading="lazy" draggable="false"></div><span class="gr-n">03</span><h3>400 килограммов</h3><p>Столько весит наш Гирирадж. Передвигается Он только с помощью крана или трактора.</p></article><article class="gr-st"><div class="gr-ph"><img src="/images/groups/a802b6b523b0d8b240fca1a701dc25db.jpg" alt="" loading="lazy" draggable="false"></div><span class="gr-n">04</span><h3>Первый храм</h3><p>Четыре металлических столба и жестяная крыша. Зато праздники в этом храме были самые настоящие.</p></article><article class="gr-st"><div class="gr-ph"><img src="/images/groups/e7ed1259a60371b9e71f25f4a0317dd7.jpg" alt="" loading="lazy" draggable="false"></div><span class="gr-n">05</span><h3>Новый храм</h3><p>Мы долго проектировали его и продумали каждую деталь — от резного камня до решёток-джали.</p></article><article class="gr-st"><div class="gr-ph"><img src="/images/groups/65de000c0d25ee05c6243cadb127b7d4.jpg" alt="" loading="lazy" draggable="false"></div><span class="gr-n">06</span><h3>Сегодня</h3><p>Храм Гирираджа — центр всех праздников ашрама. Цветы для Него круглый год растут в нашей кундже.</p></article><article class="gr-st gr-only"><div class="gr-ph"><img src="/images/groups/2bca0b0e4b791ac894eeac5088fd1f05.jpg" alt="Шри Гирирадж" loading="lazy" draggable="false"></div></article><article class="gr-st gr-end"><p class="gr-v">ниджа-никат̣а-нива̄сам̇ дехи говардхана твам</p><p class="gr-vt">О Говардхан, прошу Тебя, позволь мне поселиться у Твоего склона…</p><p class="gr-vs">Шрила Рагхунатха дас Госвами, «Говардхана-васа-прартхана-дашакам»</p><a href="/giriraj">Вся история Гирираджа<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a></article></div><div class="wrap gr-nav"><button type="button" data-gr-prev aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></button><button type="button" data-gr-next aria-label="Дальше"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button></div>
<div class="gs" id="goswamis"><div class="wrap"><div class="wr-sub"><h3 class="wr-h">Госвами и Шрила Прабхупада</h3><div><p class="wr-l">Мы построили из земли Враджа шесть кутиров и пригласили в каждый мурти одного из Госвами.</p><p class="gs-use">Около ста вайшнавов могут одновременно собираться в кутирах, чтобы разбирать шастры малыми группами.</p></div></div></div><div class="gs-row"><figure class="gs-n gs-pr"><span class="gs-arch"><img src="/images/groups/0ec445009020083236ddea81e10a3d92.jpg" alt="Шрила Прабхупада" loading="lazy" draggable="false"></span><figcaption>Шрила Прабхупада</figcaption></figure><figure class="gs-n"><span class="gs-arch"><img src="/images/groups/a3d486051a97a9def9efa4572a69d078.jpg" alt="Рупа Госвами" loading="lazy" draggable="false"></span><figcaption>Рупа Госвами</figcaption></figure><figure class="gs-n"><span class="gs-arch"><img src="/images/groups/1457130606381f7e0abcd854ae53f602.jpg" alt="Санатана Госвами" loading="lazy" draggable="false"></span><figcaption>Санатана Госвами</figcaption></figure><figure class="gs-n"><span class="gs-arch"><img src="/images/groups/c085d1bd489f7c33d3df311544f89d73.jpg" alt="Рагхунатха Бхатта Госвами" loading="lazy" draggable="false"></span><figcaption>Рагхунатха Бхатта Госвами</figcaption></figure><figure class="gs-n"><span class="gs-arch"><img src="/images/groups/857710295ad4478f02bb1ae230a7ffc1.jpg" alt="Рагхунатха дас Госвами" loading="lazy" draggable="false"></span><figcaption>Рагхунатха дас Госвами</figcaption></figure><figure class="gs-n"><span class="gs-arch"><img src="/images/groups/7c8a4ae665017bdc326bcf369bc27460.jpg" alt="Джива Госвами" loading="lazy" draggable="false"></span><figcaption>Джива Госвами</figcaption></figure><figure class="gs-n"><span class="gs-arch"><img src="/images/groups/4224110d50ca4d7b355e73778dddae46.jpg" alt="Гопала Бхатта Госвами" loading="lazy" draggable="false"></span><figcaption>Гопала Бхатта Госвами</figcaption></figure></div><div class="wrap gs-foot"><p class="gs-v">ванде рӯпа-сана̄танау рагху-йугау шрӣ-джӣва-гопа̄лакау</p><a class="gs-more" href="/ru/groups/vaishnava-worship">Подробнее о Госвами Вриндавана<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a></div></div></section>
<section class="sec spaces" id="spaces"><div class="wrap"><div class="g12 head"><div class="t"><p class="eyebrow"><i></i>Пространства</p><h2 class="caps">Место <br>для каждой части <br>вашей программы</h2></div><div class="body"><p class="lead-it">Зал для катхи и киртана, бхаджан-кутиры для изучения шастр малыми группами, крыша с видом на Говардхан и прасадам-холл для всей группы.</p></div></div>
<div class="sp-pan" onMouseEnter="{{sStop}}"><div class="{{SC0}}" style="--d:0.10s;{{SM0}}" onMouseEnter="{{SP0}}" onMouseMove="{{SMV0}}"><div class="sp-ph"><img class="{{SI0_0}}" src="/images/groups/4663edde6cbf475fcb139bdd830b00c7.webp" alt="Лекционный зал"><img class="{{SI0_1}}" src="/images/groups/2aab30ccf1c61d8639134c9f45ecb120.webp" alt="Лекционный зал"></div><div class="sp-sh"></div><div class="sp-dots"><i class="{{SI0_0}}"></i><i class="{{SI0_1}}"></i></div><div class="sp-spine" aria-hidden="true">Лекционный зал</div><button type="button" class="sp-open" aria-label="Показать лекционный зал" aria-expanded="{{SE0}}" onClick="{{SP0}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button><div class="sp-bot"><div class="sp-v"><span class="sp-cnt" style="--to:135"></span><small>m²</small></div><div class="sp-more"><div><h3>Лекционный зал</h3><p>Комфортный зал с кондиционером для катхи, киртана и лекций, 175 м².</p><span class="sp-w">Гостевой дом, третий этаж</span></div></div></div></div><div class="{{SC1}}" style="--d:0.22s;{{SM1}}" onMouseEnter="{{SP1}}" onMouseMove="{{SMV1}}"><div class="sp-ph"><img class="{{SI1_0}}" src="/images/groups/f4b3906a975d72b200ff1e143f133910.webp" alt="Открытые площадки"><img class="{{SI1_1}}" src="/images/groups/12acbad10d44b85e9a4cc72a50063447.webp" alt="Открытые площадки"><img class="{{SI1_2}}" src="/images/groups/0c0ca5111e8f471d6c005bdfe6d5fd17.webp" alt="Открытые площадки"></div><div class="sp-sh"></div><div class="sp-dots"><i class="{{SI1_0}}"></i><i class="{{SI1_1}}"></i><i class="{{SI1_2}}"></i></div><div class="sp-spine" aria-hidden="true">Открытые площадки</div><button type="button" class="sp-open" aria-label="Показать открытые площадки" aria-expanded="{{SE1}}" onClick="{{SP1}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button><div class="sp-bot"><div class="sp-v sp-word">На воздухе</div><div class="sp-more"><div><h3>Открытые площадки</h3><p>Крыша с видом на Говардхан, площадка в Кундже, открытые беседки.</p><span class="sp-w">Крыша и сад</span></div></div></div></div><div class="{{SC2}}" style="--d:0.34s;{{SM2}}" onMouseEnter="{{SP2}}" onMouseMove="{{SMV2}}"><div class="sp-ph"><img class="{{SI2_0}}" src="/images/groups/62d495d5a2163e742251fd9292aa46f2.webp" alt="Прасадам-холл"></div><div class="sp-sh"></div><div class="sp-dots"></div><span class="sp-tmp">Временное фото</span><div class="sp-spine" aria-hidden="true">Прасадам-холл</div><button type="button" class="sp-open" aria-label="Показать прасадам-холл" aria-expanded="{{SE2}}" onClick="{{SP2}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button><div class="sp-bot"><div class="sp-v"><span class="sp-cnt" style="--to:150"></span><small>гостей</small></div><div class="sp-more"><div><h3>Прасадам-холл</h3><p>Около <span class="odo"><span class="od-sr">160</span><span aria-hidden="true"><span class="od-c" style="--i:0"><span class="od-ph">1</span><span class="od-r" style="--d:11">0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</span></span><span class="od-c" style="--i:1"><span class="od-ph">6</span><span class="od-r" style="--d:16">0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</span></span><span class="od-c" style="--i:2"><span class="od-ph">0</span><span class="od-r" style="--d:10">0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</span></span></span></span> м² обеденного пространства со столами.</p><span class="sp-w">Рядом с кухней</span></div></div></div></div><div class="{{SC3}}" style="--d:0.46s;{{SM3}}" onMouseEnter="{{SP3}}" onMouseMove="{{SMV3}}"><div class="sp-ph"><img class="{{SI3_0}}" src="/images/groups/9da9cb239860699e27ee55db5997b995.webp" alt="Кутиры"><img class="{{SI3_1}}" src="/images/groups/9e8d9b2637a47952e572c86adabd1a7a.webp" alt="Кутиры"></div><div class="sp-sh"></div><div class="sp-dots"><i class="{{SI3_0}}"></i><i class="{{SI3_1}}"></i></div><div class="sp-spine" aria-hidden="true">Кутиры</div><button type="button" class="sp-open" aria-label="Показать кутиры" aria-expanded="{{SE3}}" onClick="{{SP3}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button><div class="sp-bot"><div class="sp-v"><span class="sp-cnt" style="--to:6"></span><small>кутиров</small></div><div class="sp-more"><div><h3>Кутиры</h3><p>Бхаджан-кутиры шести Госвами среди деревьев кунджи. Около ста вайшнавов могут одновременно собираться в них для разбора шастр малыми группами.</p><span class="sp-w">В саду</span></div></div></div></div></div>
<div class="{{sAuto}}"><i></i>Пространства сменяют друг друга. Наведите курсор, чтобы рассмотреть любое.</div>
<a class="exit rv" href="/plan"><div class="t">Подробнее<br>о пространствах</div><div class="d"><span>Зал, открытая крыша, площадки в Кундже и кутиры.</span></div><span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"></path></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span></a>
</div></section>
<section class="sec service" id="service"><div class="wrap"><div class="g12 head"><div class="t"><p class="eyebrow"><i></i>Сервис</p><h2 class="caps">Мы устроим<br>всё, что нужно<br>вашему ретриту</h2></div><div class="body"><p class="lead-it">У вашей группы будет свой координатор — он говорит по-русски, по-английски и на хинди. Расскажите заранее, что вам понадобится, — и к вашему прилёту всё будет готово.</p></div></div>
<div class="sv-grid" style="{{svSpot}}" onMouseMove="{{svMove}}"><div class="sv-cell"><span class="icw a-car"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l2-5h14l2 5v5H3z"></path><path d="M3 13h18"></path><circle cx="7.5" cy="16" r="1.4"></circle><circle cx="16.5" cy="16" r="1.4"></circle></svg></span><b>Такси и трансферы</b><p>Из аэропорта Дели или со станции Матхура, а ещё поездки по Враджу.</p></div><div class="sv-cell"><span class="icw a-bus"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="15" rx="2"></rect><path d="M4 11h16M8 21v-3M16 21v-3"></path><circle cx="8" cy="14.5" r=".8"></circle><circle cx="16" cy="14.5" r=".8"></circle></svg></span><b>Автобусы и гиды</b><p>Для заезда, отъезда и паломничеств по Враджу — с гидом.</p></div><div class="sv-cell"><span class="icw a-sim"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"></path><rect x="9.5" y="11" width="6" height="7" rx="1"></rect></svg></span><b>Индийские сим-карты</b><p>С мобильным интернетом — оформим по приезде, нужен паспорт.</p></div><div class="sv-cell"><span class="icw a-cur"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M8.5 8h7M8.5 11h7M10 8c3.5 0 3.5 6 0 6l4.5 3.5"></path></svg></span><b>Обмен валюты</b><p>Поможем с обменом валюты на рупии.</p></div><div class="sv-cell"><span class="icw a-wash"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><g class="drum"><circle cx="12" cy="13" r="4.5"></circle><path d="M9.5 12.5c1.2-1 3.8-1 5 0"></path></g><path d="M8 6.5h.01M11 6.5h3"></path></svg></span><b>Прачечная</b><p>Стирка и глажка для всей группы.</p></div><div class="sv-cell"><span class="icw a-hotel"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V7l8-4 8 4v14"></path><path d="M9 21v-5h6v5"></path><path class="win" d="M8 10h2M14 10h2M8 13h2M14 13h2"></path></svg></span><b>Отели и рикши</b><p>Для групп больше 72 человек.</p></div><div class="sv-cell"><span class="icw a-bell"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14"></path><path d="M6.5 17a5.5 5.5 0 0 1 11 0"></path><path d="M12 9.5V8"></path><path d="M4 20h16"></path></svg></span><b>Ресепшен</b><p>Каждый день на месте есть кто-то, кто поможет.</p></div><div class="sv-cell"><span class="icw a-any"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"></path></svg></span><b>Всё остальное</b><p>Врач, покупки, билеты — просто скажите.</p></div></div>

</div></section>

<div class="g12 head"><div class="t"><p class="eyebrow"><i></i>Об ашраме</p><h2 class="caps">Шри Рупа<br>Сева Кунджа</h2></div>
<div class="body"><p class="lead-it">Центр учения и служения у подножия Говардхана.</p><p style="margin-top:16px">Каждое слово в названии ашрама говорит о том, как здесь устроена жизнь. Раскройте слово, чтобы прочитать больше.</p></div></div>
<div class="words">
<div class="{{W0}}"><button type="button" class="wh" aria-expanded="{{E0}}" onClick="{{H0}}"><span class="wn">01</span><span class="ww">Шри</span><span class="wdev">श्री</span><span class="wtr">красота</span></button><div class="wx"><div class="wi"><div class="wc"><p>Здания и сад, лекции и киртаны, служение и то, как люди относятся друг к другу, — мы хотим, чтобы всё это отражало красоту духовного мира.</p><div class="ph"><img src="/images/groups/a31c3b15efe5402fa33afdd331edaffb.webp" alt="" loading="lazy"></div></div></div></div></div>
<div class="{{W1}}"><button type="button" class="wh" aria-expanded="{{E1}}" onClick="{{H1}}"><span class="wn">02</span><span class="ww">Рупа</span><span class="wdev">रूप</span><span class="wtr">форма</span></button><div class="wx"><div class="wi"><div class="wc"><p>Рупа — это образ бхакти, которой мы служим: наши ачарьи Рупа Госвами и Шрила Прабхупада, слушание и воспевание и прекрасные Божества Шри Шри Радхи-Говинды.</p><div class="ph"><img src="/images/groups/4663edde6cbf475fcb139bdd830b00c7.webp" alt="" loading="lazy"></div></div></div></div></div>
<div class="{{W2}}"><button type="button" class="wh" aria-expanded="{{E2}}" onClick="{{H2}}"><span class="wn">03</span><span class="ww">Сева</span><span class="wdev">सेवा</span><span class="wtr">служение</span></button><div class="wx"><div class="wi"><div class="wc"><p>Служение — и цель жизни, и путь к ней. В этом духе в ашраме делается всё, в том числе забота о вашей группе.</p><div class="ph"><img src="/images/groups/f4b3906a975d72b200ff1e143f133910.webp" alt="" loading="lazy"></div></div></div></div></div>
<div class="{{W3}}"><button type="button" class="wh" aria-expanded="{{E3}}" onClick="{{H3}}"><span class="wn">04</span><span class="ww">Кунджа</span><span class="wdev">कुञ्ज</span><span class="wtr">роща</span></button><div class="wx"><div class="wi"><div class="wc"><p>Тихое укромное место вдали от шума и любопытных глаз, где можно жить простой и красивой духовной жизнью.</p><div class="ph"><img src="/images/groups/0b388d637db2ea02b74639e58c18159f.webp" alt="" loading="lazy"></div></div></div></div></div>
</div>
<div class="foot"><p>3,5 гектара у деревни Аньор, в 400 метрах от тропы парикрамы вокруг Говардхана. Ашрам основан по просьбе Шрилы Бхакти Вигьяны Госвами. Храм Шри Шри Радхи-Говинды откроется в сентябре 2027 года.</p><a class="btn btn-line on-light" href="/plan">План территории <span class="arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"></path></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span></a></div><a class="exit exit-site" href="/"><div class="t">Перейти<br>на сайт ашрама</div><div class="d"><span>Ашрам, его учителя, праздники и повседневная жизнь.</span></div><span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"></path></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span></a>
