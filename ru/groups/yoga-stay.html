<style>
body{margin:0;background:#f6fcf4}
*{box-sizing:border-box}
.pg{--bg:#f6fcf4;--bg2:#e7f2e3;--green:#155915;--green-d:#0d3b0d;--sun:#ffa30b;--sun-ink:#8a5200;--ink:#212322;--mute:#4d564f;--line:rgba(33,35,34,.16);--ease:cubic-bezier(.33,1,.68,1);--ease-out:cubic-bezier(.16,1,.3,1);--hfs:clamp(42px,5.3vw,76px);
 background:var(--bg);color:var(--ink);font:400 18px/1.6 'Open Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
:where(.pg) a{color:inherit}
.wrap{max-width:1392px;margin:0 auto;padding:0 clamp(16px,4vw,56px)}
.eb{display:inline-flex;align-items:center;gap:14px;margin:0;font-size:14px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--sun-ink)}
.eb i{display:block;width:40px;height:1px;background:currentColor}
.caps{font-family:'Cormorant Garamond',serif;font-weight:300;text-transform:uppercase;letter-spacing:.05em;line-height:.95;color:var(--green-d);margin:0}
h2.caps{font-size:calc(var(--hfs) * .9);margin-top:22px}
.lead{margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(24px,2.4vw,32px);line-height:1.32;color:var(--ink)}
.sec{padding:120px 0}
.head{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:last baseline;margin-bottom:64px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;border:1px solid rgba(13,59,13,.3);font:600 15px 'Open Sans';letter-spacing:.08em;text-decoration:none;color:var(--green-d);transition:background .35s,color .35s,border-color .35s}
.btn svg{width:20px;height:20px;flex:none}
.btn:hover{background:var(--green);border-color:var(--green);color:#fff}
.btn-sun{background:var(--sun);border-color:var(--sun);color:#1f1a10;text-transform:uppercase;letter-spacing:.14em;padding:18px 28px}
.btn-sun:hover{background:#fff;border-color:#fff;color:var(--green-d)}
.btn-ghost{border-color:rgba(255,255,255,.35);color:#fff}
.btn-ghost:hover{background:#fff;color:var(--green-d);border-color:#fff}
.s-am-i{display:grid;place-items:center;width:52px;height:52px;flex:none;border-radius:50%;background:#fff;color:var(--green);box-shadow:inset 0 0 0 1px rgba(13,59,13,.12)}
.s-am-i svg{width:26px;height:26px}
/* появление при прокрутке */
@media (min-width:768px) and (prefers-reduced-motion:no-preference){html.rv-js .rv{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease-out),transform 1s var(--ease-out)}html.rv-js .rv.in{opacity:1;transform:none}}

/* шапка */
.sh{position:sticky;top:12px;z-index:50;padding:0 clamp(12px,2vw,24px)}
.sh-in{display:flex;align-items:center;gap:22px;max-width:1360px;margin:12px auto 0;padding:10px 12px 10px 22px;border-radius:999px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);box-shadow:0 10px 30px -18px rgba(13,59,13,.35)}
.sh-logo{display:block;flex:none}
.sh .lg{display:block;height:34px;width:auto;fill:#000}
.lg .lg-acc{fill:var(--sun)}
.sh-back{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:var(--mute);text-decoration:none;white-space:nowrap}
.sh-back svg{width:18px;height:18px;transition:transform .3s var(--ease)}
.sh-back:hover{color:var(--green-d)}
.sh-back:hover svg{transform:translateX(-3px)}
.sh-nav{display:flex;gap:22px;margin-left:auto}
.sh-nav a{font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--mute);padding:6px 0;border-bottom:1.5px solid transparent;transition:color .3s,border-color .3s}
.sh-nav a:hover{color:var(--green-d)}
.sh-nav a.on{color:var(--green-d);border-color:var(--sun)}
.sh-r{display:flex;align-items:center;gap:12px}
.sh-lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--bg2);font-size:13px;font-weight:600}
.sh-lang a,.sh-lang b{padding:5px 10px;border-radius:999px;text-decoration:none;color:var(--mute)}
.sh-lang b{background:#fff;color:var(--green-d)}
.sh-ct{position:relative}
.sh-ctb{padding:12px 20px;border:0;border-radius:999px;background:var(--green);color:#fff;font:600 14px 'Open Sans';letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.sh-cm{position:absolute;right:0;top:calc(100% + 10px);min-width:250px;padding:8px;border-radius:20px;background:#fff;box-shadow:0 24px 50px -20px rgba(13,59,13,.45);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .25s,transform .3s var(--ease),visibility .25s}
.sh-ct.open .sh-cm{opacity:1;visibility:visible;transform:none}
.sh-cm a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;text-decoration:none;font-size:16px}
.sh-cm a:hover{background:var(--bg2)}
.sh-cm svg{width:20px;height:20px;color:var(--green)}

/* первый экран */
.s-hero{padding:72px 0 110px}
.s-hero-g{display:grid;grid-template-columns:5fr 7fr;gap:64px;align-items:end}
.s-hero h1{font-size:var(--hfs);margin-top:24px}
.s-hero .lead{margin-top:32px;max-width:520px}
.s-hero-ph{margin:0;aspect-ratio:7/5;overflow:hidden;border-top-left-radius:120px;cursor:zoom-in}
.s-hero-ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.6s var(--ease)}
.s-hero-ph:hover img{transform:scale(1.03)}
.s-facts{list-style:none;margin:72px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.s-facts li{padding:28px 24px 0 0}
.s-facts li+li{padding-left:28px;border-left:1px solid var(--line)}
.s-facts b{display:block;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:44px;line-height:1;color:var(--green-d)}
.s-facts span{display:block;margin-top:10px;font-size:16px;line-height:1.5;color:var(--mute)}

/* гостевой дом */
.s-house{background:var(--bg2)}
.s-house-g{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
.s-house-txt p{margin:0 0 20px;color:var(--mute)}
.s-am{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:32px 28px}
.s-am li{display:grid;grid-template-columns:52px 1fr;column-gap:16px}
.s-am .s-am-i{grid-row:1/3}
.s-am b{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:24px;line-height:1.15;color:var(--green-d)}
.s-am p{margin:6px 0 0;font-size:16px;line-height:1.5;color:var(--mute)}

/* номера */
.rm-g{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.rm-ph{aspect-ratio:4/3;overflow:hidden;border-top-left-radius:80px;background:#ddd;cursor:zoom-in}
.rm-ph img{width:100%;height:100%;object-fit:cover;display:block}
.rm-th{display:flex;gap:10px;margin-top:12px}
.rm-th button{flex:1;padding:0;border:0;aspect-ratio:4/3;overflow:hidden;border-radius:10px;cursor:pointer;opacity:.55;outline:2px solid transparent;outline-offset:2px;transition:opacity .3s,outline-color .3s}
.rm-th button.on,.rm-th button:hover{opacity:1}
.rm-th button.on{outline-color:var(--sun)}
.rm-th img{width:100%;height:100%;object-fit:cover;display:block}
.rm h3{margin:26px 0 0;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:calc(var(--hfs) * .6);line-height:1;text-transform:uppercase;letter-spacing:.05em;color:var(--green-d)}
.rm-c{margin:8px 0 0;font-size:14px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--sun-ink)}
.rm-t{margin:48px 0 0;border-top:1px solid var(--line)}
.rm-r{display:grid;grid-template-columns:1fr 1fr;column-gap:40px;row-gap:6px;padding:18px 0;border-bottom:1px solid var(--line)}
.rm-r dt{grid-column:1/-1;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--sun-ink)}
.rm-r dd{margin:0;font-size:18px;line-height:1.5}

/* расселение */
.s-plan{background:var(--bg2)}
.pl-g{display:grid;grid-template-columns:420px 1fr;gap:56px;align-items:start}
.pl-ctl{padding:36px;border-radius:0 0 0 0;border-top-left-radius:64px;background:#fff}
.pl-l{display:block;margin:0;font-size:14px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.pl-n b{display:block;margin-top:8px;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:72px;line-height:1;color:var(--green-d)}
.pl-ctl input[type=range]{width:100%;margin:18px 0 6px;accent-color:var(--green)}
.pl-sc{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.pl-ctl .pl-l+.pl-seg,.pl-sc+.pl-l{margin-top:26px}
.pl-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:12px;padding:4px;border-radius:999px;background:var(--bg2)}
.pl-seg button{padding:11px 10px;border:0;border-radius:999px;background:none;font:600 14px/1.25 'Open Sans';color:var(--mute);cursor:pointer;transition:background .3s,color .3s}
.pl-seg button.on{background:var(--green);color:#fff}
.pl-res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.pl-res b{display:block;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:44px;line-height:1;color:var(--green-d)}
.pl-res span{display:block;margin-top:6px;font-size:14px;line-height:1.35;color:var(--mute)}
.pl-over{margin:20px 0 0;padding:14px 16px;border-radius:14px;background:#fff6e5;font-size:16px;line-height:1.5}
.pl-over a{color:var(--sun-ink);font-weight:600}
.pl-kid{margin:20px 0 0;font-size:15px;line-height:1.5;color:var(--mute)}
.pl-fl{padding:26px 28px;border-radius:24px;background:rgba(255,255,255,.6)}
.pl-fl+.pl-fl{margin-top:14px}
.pl-fl p{display:flex;align-items:baseline;gap:14px;margin:0 0 16px}
.pl-fl p b{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:26px;color:var(--green-d)}
.pl-fl p span{font-size:15px;color:var(--mute)}
.pl-row{display:flex;flex-wrap:wrap;gap:10px}
.tl{display:grid;gap:5px;padding:9px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1.5px rgba(13,59,13,.18);transition:box-shadow .4s}
.tl-tw{grid-template-columns:repeat(2,16px)}
.tl-qd{grid-template-columns:repeat(2,16px);grid-template-rows:repeat(2,16px);box-shadow:inset 0 0 0 1.5px rgba(138,82,0,.35)}
.tl i{width:16px;height:16px;border-radius:5px;background:var(--bg2);transition:background .35s,transform .35s var(--ease)}
.tl i.on{background:var(--green);transform:scale(1.04)}
.tl.used{box-shadow:inset 0 0 0 1.5px var(--green)}
.pl-leg{display:flex;flex-wrap:wrap;gap:22px;margin-top:20px;font-size:14px;color:var(--mute)}
.pl-leg span{display:inline-flex;align-items:center;gap:8px}
.pl-leg i{display:inline-block;width:16px;height:16px;border-radius:5px}
.lg-tw{box-shadow:inset 0 0 0 1.5px rgba(13,59,13,.3);background:#fff}
.lg-qd{box-shadow:inset 0 0 0 1.5px rgba(138,82,0,.5);background:#fff}
.lg-on{background:var(--green)}
.pl-note{margin:10px 0 0;font-size:14px;color:var(--mute)}

/* порядок проживания и правила */
.s-info-g{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
.s-info-g li{display:flex;gap:18px;padding:30px 28px 30px 0;border-bottom:1px solid var(--line)}
.s-info-g li:not(:nth-child(3n+1)){padding-left:28px;border-left:1px solid var(--line)}
.s-info-g b{display:block;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:26px;line-height:1.15;color:var(--green-d)}
.s-info-g p{margin:8px 0 0;font-size:16px;line-height:1.55;color:var(--mute)}
.s-rules{display:grid;grid-template-columns:360px 1fr;gap:56px;margin-top:80px;padding:48px;border-top-left-radius:80px;background:var(--green-d);color:#fff}
.s-rules .eb{color:var(--sun)}
.s-rules-l{margin:20px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;line-height:1.35}
.s-rules ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.s-rules .s-am-i{background:rgba(255,255,255,.1);color:var(--sun);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.s-rules b{display:block;margin-top:18px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:26px;line-height:1.15}
.s-rules li p{margin:8px 0 0;font-size:16px;line-height:1.5;color:rgba(255,255,255,.78)}

/* галерея */
.s-gal{background:var(--bg2)}
.gl-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.gl-tabs button{padding:11px 20px;border:1px solid rgba(13,59,13,.25);border-radius:999px;background:none;font:600 14px 'Open Sans';letter-spacing:.06em;color:var(--green-d);cursor:pointer;transition:background .3s,color .3s}
.gl-tabs button.on{background:var(--green);border-color:var(--green);color:#fff}
.gl-p{display:none;gap:14px;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:250px}
.gl-p.on{display:grid}
.gl-it:first-child{grid-row:span 2}
.gl-p:has(> :nth-child(3):last-child){grid-template-columns:2fr 1fr}
.gl-p:has(> :nth-child(4):last-child) > :last-child{grid-column:span 2}
.gl-it{position:relative;min-width:0;padding:0;border:0;overflow:hidden;border-radius:12px;cursor:zoom-in;background:#ccc}
.gl-it:first-child{border-top-left-radius:64px}
.gl-it img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s var(--ease)}
.gl-it:hover img{transform:scale(1.05)}
.gl-it span{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.9);font-size:14px;color:var(--ink);text-align:left;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .4s var(--ease)}
.gl-it:hover span,.gl-it:focus-visible span{opacity:1;transform:none}

/* больше 72 */
.s-more-g{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.s-more .lead{margin-top:28px}
.s-more-l{list-style:none;margin:0;padding:0}
.s-more-l li{display:flex;align-items:center;gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}
.s-more-l li:first-child{border-top:1px solid var(--line)}
.s-more-l b{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:26px;line-height:1.2;color:var(--green-d)}

/* призыв */
.s-cta{background:var(--green-d);color:#fff;padding:96px 0}
.s-cta-g{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:end}
.s-cta h2.caps{color:#fff;margin:0}
.s-cta p{margin:24px 0 0;font-size:18px;line-height:1.6;color:rgba(255,255,255,.78);max-width:560px}
.s-cta-b{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.s-cta-ch{display:flex;flex-wrap:wrap;gap:10px}

/* другие разделы */
.s-oth-g{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:32px}
.s-oth-c{position:relative;display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:3/4;padding:22px;overflow:hidden;border-radius:14px;text-decoration:none;color:#fff}
.s-oth-c:first-child{border-top-left-radius:64px}
.s-oth-c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.s-oth-sh{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(10,20,8,.78))}
.s-oth-c:hover img{transform:scale(1.06)}
.s-oth-c b{position:relative;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(22px,1.8vw,28px);text-transform:uppercase;letter-spacing:.04em;line-height:1}
.s-oth-d{position:relative;margin-top:8px;font-size:15px;line-height:1.45;color:rgba(255,255,255,.85);padding-right:48px}
.s-oth-go{position:absolute;right:18px;bottom:20px;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--sun);color:#1f1a10;transition:transform .4s var(--ease)}
.s-oth-go svg{width:18px;height:18px}
.s-oth-c:hover .s-oth-go{transform:translateX(4px)}

/* подвал */
.sf{background:#14320f;color:rgba(255,255,255,.82);padding:72px 0 36px;font-size:16px;line-height:1.6}
.sf-g{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.4fr;gap:40px;align-items:start}
.sf .lg{display:block;height:44px;width:auto;fill:#fff}
.sf-h{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.sf p{margin:0}
.sf a{text-decoration:none;color:#fff}
.sf a:hover{color:var(--sun)}
.sf-b{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;margin-top:56px;padding-top:24px;border-top:1px solid rgba(255,255,255,.12);font-size:14px;color:rgba(255,255,255,.6)}
.sf-ai{display:inline-flex;align-items:center;gap:10px}
.sf-ai svg{width:18px;height:18px;color:var(--sun)}


.rm-vid{display:flex;align-items:center;gap:18px;width:100%;margin-top:22px;padding:10px 18px 10px 10px;border:1px solid rgba(13,59,13,.18);border-radius:22px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .3s,box-shadow .4s}
.rm-vid:hover{border-color:var(--green);box-shadow:0 18px 36px -24px rgba(13,59,13,.5)}
.rm-vid-ph{position:relative;flex:none;width:168px;aspect-ratio:16/9;overflow:hidden;border-radius:14px}
.rm-vid-ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1s var(--ease)}
.rm-vid:hover .rm-vid-ph img{transform:scale(1.06)}
.rm-vid-pl{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--sun);color:#1f1a10;display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(0,0,0,.45)}
.rm-vid-pl svg{width:18px;height:18px;margin-left:3px}
.rm-vid-t b{display:block;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:24px;line-height:1.15;color:var(--green-d)}
.rm-vid-t span{display:block;margin-top:4px;font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--sun-ink)}
.vl{position:fixed;inset:0;z-index:110;display:grid;place-items:center;background:rgba(12,10,6,.94);opacity:0;transition:opacity .4s}
.vl.on{opacity:1}
.vl video{width:min(92vw,calc(86vh * 16 / 9));aspect-ratio:16/9;background:#000;border-radius:10px}
.vl .lb-x{z-index:2}

.hv{position:relative;display:block;width:100%;aspect-ratio:16/7;margin:0 0 64px;padding:0;border:0;overflow:hidden;border-top-left-radius:120px;background:#2b2a22;cursor:pointer;text-align:left;font:inherit}

.hv-pl{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;background:var(--sun);color:#1f1a10;display:grid;place-items:center;box-shadow:0 18px 40px -12px rgba(0,0,0,.55);transition:transform .5s var(--ease)}
.hv-pl::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1.5px solid rgba(255,163,11,.75);animation:hvPulse 2.6s var(--ease-out) infinite}

.hv-pl svg{width:36px;height:36px;margin-left:6px}

5"/><path d="M3.5 6.5l8.5 7 8.5-7"/></svg>info@rupaseva.ru</a><a href="tel:+79250077575"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/></svg>+7 925 007 7575</a></div></div></div></div></header><main><section class="s-hero"><div class="wrap s-hero-g"><div class="s-hero-t rv"><p class="eb"><i></i>Проживание</p><h1 class="caps">30 номеров<br>для вашей<br>группы</h1><p class="lead">Гостевой дом в старом джайпурском стиле: снаружи арки, резьба и купола, внутри — привычный европейский комфорт. Мы строили его так, чтобы ничто не отвлекало от практики.</p></div><figure class="s-hero-ph rv"><img src="/images/groups/3113a1e8d736df5044be5874cb942190.webp" alt="Внутренний двор гостевого дома на закате" data-lb="0"></figure></div><div class="wrap"><ul class="s-facts rv"><li><b>30</b><span>номеров: 24 двухместных и 6 четырёхместных</span></li><li><b>72</b><span>гостя — столько живёт в доме одновременно</span></li><li><b>14:00 / 12:00</b><span>заезд и выезд — время можно обсудить</span></li><li><b>В каждом</b><span>номере своя ванная и кондиционер</span></li></ul></div></section><section class="sec s-house" id="house"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>Гостевой дом</p><h2 class="caps">Чтобы быт<br>не мешал практике</h2></div><div><p class="lead">Приезжающие в Индию часто страдают от непривычного быта: краска осыпается, приборы в розетках сгорают, шум не стихает ни днём, ни ночью. Тело протестует, ум беспокоится — и погрузиться в практику трудно.</p></div></div><button type="button" class="hv rv" data-video="/videos/groups/stay-room-1080.mp4" data-poster="/images/groups/6d749a3f00bac57cbc61b0676912bdeb.jpg" aria-label="Смотреть видео о гостевом доме"><img src="/images/groups/6d749a3f00bac57cbc61b0676912bdeb.jpg" alt="" loading="lazy"><span class="hv-sh"></span><span class="hv-pl"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg></span><span class="hv-t"><b>Видео о гостевом доме</b></span></button><div class="s-house-g"><div class="s-house-txt rv"><p>Проектируя дом, мы хотели снять эти заботы и соединить западный комфорт с традиционной индийской эстетикой. Каждую деталь делали с любовью — мы даже построили свой небольшой завод, где отливают резные элементы из фибробетона.</p><p>Толстые двойные стены и окна со стеклопакетами держат температуру и тишину. Стены отделаны по старинной технологии — известковой штукатуркой.</p><p>На первом этаже у каждого номера свой балкончик и небольшой садик, так что под окнами никто не ходит. С балконов второго этажа открывается вид на Гирираджа. Для Божеств, с которыми приезжают гости, в номерах есть ниши-алтари.</p></div><ul class="s-am rv"><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5s6 6.4 6 10.5a6 6 0 0 1-12 0c0-4.1 6-10.5 6-10.5z"/></svg></span><b>Горячая вода весь день</b><p>Водонагреватель в каждой ванной — не только по утрам.</p></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg></span><b>Резервный генератор</b><p>Включается сам, если пропадает электричество.</p></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/><path d="M9.5 4.5L12 6.5l2.5-2M9.5 19.5l2.5-2 2.5 2"/></svg></span><b>Кондиционер в каждом номере</b><p>Прохладно в жару и тепло зимними ночами.</p></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4-1.5v-5z"/></svg></span><b>Очищенная вода</b><p>Местная вода жёсткая и солёная, поэтому вся вода в доме проходит очистку.</p></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5a12 12 0 0 1 17 0M6.5 12.7a7.5 7.5 0 0 1 11 0M9.5 15.8a3.2 3.2 0 0 1 5 0"/><circle cx="12" cy="18.6" r=".6" fill="currentColor"/></svg></span><b>Wi-Fi</b><p>В номерах, в зале и в общих зонах.</p></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14M6.5 17a5.5 5.5 0 0 1 11 0M12 9.5V8M10.5 8h3M4 20h16"/></svg></span><b>Ресепшен и прачечная</b><p>На ресепшене всегда помогут, а бельё всей группы постираем.</p></li></ul></div></div></section><section class="sec s-rooms" id="rooms"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>Номера</p><h2 class="caps">Два типа<br>номеров</h2></div><div><p class="lead">Настоящие фото, без 3D-рендеров. В каждом номере — своя ванная, кондиционер, полотенца и свежее бельё, кувшин для воды.</p></div></div><div class="rm-g"><div class="rm rv" data-room="twin"><div class="rm-ph"><img src="/images/groups/76b19c53a23fce46b44c78cbe20b6707.webp" alt="Двухместный номер" data-room-main></div><div class="rm-th"><button type="button" class="on" data-src="/images/groups/76b19c53a23fce46b44c78cbe20b6707.webp" data-alt="Двухместный номер" aria-label="Двухместный номер"><img src="/images/groups/76b19c53a23fce46b44c78cbe20b6707.webp" alt=""></button><button type="button" class="" data-src="/images/groups/1e74a0a674862392aaf63a3a43e66001.webp" data-alt="Две кровати и ниша для алтаря" aria-label="Две кровати и ниша для алтаря"><img src="/images/groups/1e74a0a674862392aaf63a3a43e66001.webp" alt=""></button><button type="button" class="" data-src="/images/groups/b48251069d43cd97a817a87d41d8601e.webp" data-alt="Своя ванная" aria-label="Своя ванная"><img src="/images/groups/b48251069d43cd97a817a87d41d8601e.webp" alt=""></button><button type="button" class="" data-src="/images/groups/9345b11f48a3306e76ada8ea70ddaa55.webp" data-alt="Вид с балкона" aria-label="Вид с балкона"><img src="/images/groups/9345b11f48a3306e76ada8ea70ddaa55.webp" alt=""></button></div><h3>Двухместный</h3><p class="rm-c">24 номера · по 2 гостя</p></div><div class="rm rv" data-room="quad"><div class="rm-ph"><img src="/images/groups/a9de499abefc2e1c37f07fab13585f61.webp" alt="Четырёхместный номер" data-room-main></div><div class="rm-th"><button type="button" class="on" data-src="/images/groups/a9de499abefc2e1c37f07fab13585f61.webp" data-alt="Четырёхместный номер" aria-label="Четырёхместный номер"><img src="/images/groups/a9de499abefc2e1c37f07fab13585f61.webp" alt=""></button><button type="button" class="" data-src="/images/groups/7d3392510158fd2b6d61ff6046bbdbc4.webp" data-alt="Гостиная зона" aria-label="Гостиная зона"><img src="/images/groups/7d3392510158fd2b6d61ff6046bbdbc4.webp" alt=""></button><button type="button" class="" data-src="/images/groups/afae1739e8e836e29c55d0aa386b40d1.webp" data-alt="Письменный стол" aria-label="Письменный стол"><img src="/images/groups/afae1739e8e836e29c55d0aa386b40d1.webp" alt=""></button><button type="button" class="" data-src="/images/groups/3886e9433c145c653867c914b1065a2e.webp" data-alt="Ванная" aria-label="Ванная"><img src="/images/groups/3886e9433c145c653867c914b1065a2e.webp" alt=""></button></div><h3>Четырёхместный</h3><p class="rm-c">6 номеров · по 4 гостя</p></div></div><dl class="rm-t rv"><div class="rm-r"><dt>Сколько</dt><dd>24 номера: 20 на первом этаже, 4 на втором</dd><dd>6 номеров, все на втором этаже</dd></div><div class="rm-r"><dt>Кровати</dt><dd>Две односпальные кровати, матрасы IKEA</dd><dd>Две двухъярусные кровати с удобной лесенкой; у каждой — лампа и розетки</dd></div><div class="rm-r"><dt>Ванная</dt><dd>Своя, с горячей водой</dd><dd>Своя, с горячей водой</dd></div><div class="rm-r"><dt>Шкафы и зеркала</dt><dd>Два шкафа, большие зеркала</dd><dd>Четыре шкафа, большие зеркала</dd></div><div class="rm-r"><dt>Чтобы отдохнуть</dt><dd>Уголок с ротанговыми креслами и столиком</dd><dd>Гостиная зона: диван, кресла и столик; письменный стол</dd></div><div class="rm-r"><dt>Особенное</dt><dd>Ниша в стене для вашего алтаря</dd><dd>Мини-кухня с раковиной</dd></div><div class="rm-r"><dt>Балкон и вид</dt><dd>Внизу — свой балкончик и садик, наверху — вид на Гирираджа</dd><dd>Балкон с видом на Гирираджа</dd></div><div class="rm-r"><dt>Кондиционер</dt><dd>Есть</dd><dd>Есть</dd></div></dl></div></section><section class="sec s-info" id="info"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>Порядок проживания</p><h2 class="caps">Что важно<br>знать заранее</h2></div><div></div></div><ul class="s-info-g rv"><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span><div><b>Заезд и выезд</b><p>Заезд с 14:00, выезд до 12:00. Если рейс раньше или позже — напишите, всё можно обсудить.</p></div></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></svg></span><div><b>Уборка и бельё</b><p>Убираем номер и меняем бельё по вашему запросу — когда удобно вам.</p></div></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v16H6z"/><path d="M6 9h12M9.5 13.5h5"/></svg></span><div><b>Что есть в номере</b><p>Полотенца и бельё, кувшин для воды, шкафы (в четырёхместном — четыре), большие зеркала.</p></div></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="6" r="2.5"/><path d="M8 21v-5l-2-3 3-3h6l3 3-2 3v5M10.5 21v-4h3v4"/></svg></span><div><b>Дети</b><p>Для детей можно поставить дополнительную кровать — лучше согласовать заранее.</p></div></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8l-1 3 2 2v10a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V9l2-2z"/><path d="M17 11h1.5a1.5 1.5 0 0 1 0 3H17"/></svg></span><div><b>Вода</b><p>Вся вода в доме очищена. Кувшин в номере можно наполнить в любое время.</p></div></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14M6.5 17a5.5 5.5 0 0 1 11 0M12 9.5V8M10.5 8h3M4 20h16"/></svg></span><div><b>Ресепшен</b><p>Помогут с ключами, прачечной, такси и любыми вопросами.</p></div></li></ul><div class="s-rules rv"><div class="s-rules-h"><p class="eb"><i></i>Правила ашрама</p><p class="s-rules-l">Ашрам — святое место, и мы бережём его атмосферу. Просим всех гостей соблюдать три правила.</p></div><ul><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z"/><path d="M5 19l8-8"/></svg></span><b>Без мяса, рыбы и яиц</b><p>На территории — только вегетарианская еда.</p></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10l-1 16H8z"/><path d="M4 4l16 16"/></svg></span><b>Без интоксикаций</b><p>Никакого алкоголя, табака и других одурманивающих веществ.</p></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3l3 3 3-3 4 3-2 4-2-1v12H9V9l-2 1-2-4z"/></svg></span><b>Скромная одежда</b><p>Как принято в святых местах Индии: плечи и колени закрыты.</p></li></ul></div></div></section><section class="sec s-gal" id="photos"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>Фотографии</p><h2 class="caps">Гостевой дом<br>как он есть</h2></div><div><p class="lead">Все фото сняты в ашраме. Никаких изображений, созданных ИИ, и стоковых картинок.</p></div></div><div class="gl-tabs rv" role="tablist"><button type="button" class="on" data-gt="0" role="tab" aria-selected="true">Двор и сад</button><button type="button" class="" data-gt="1" role="tab" aria-selected="false">Номера</button><button type="button" class="" data-gt="2" role="tab" aria-selected="false">Ванные и детали</button><button type="button" class="" data-gt="3" role="tab" aria-selected="false">Крыша и виды</button></div><div class="gl rv"><div class="gl-p on" data-gp="0"><button type="button" class="gl-it" style="--ar:1.5" data-lb="1"><img src="/images/groups/3113a1e8d736df5044be5874cb942190.webp" alt="Внутренний двор на закате" loading="lazy"><span>Внутренний двор на закате</span></button><button type="button" class="gl-it" style="--ar:1.5" data-lb="2"><img src="/images/groups/724c2e217c8ba70e8c2dd242560ac760.webp" alt="Сад перед гостевым домом" loading="lazy"><span>Сад перед гостевым домом</span></button><button type="button" class="gl-it" style="--ar:1.5" data-lb="3"><img src="/images/groups/79e2f02ff951a3855ceb97336082d653.webp" alt="Фасад" loading="lazy"><span>Фасад</span></button><button type="button" class="gl-it" style="--ar:1.5" data-lb="4"><img src="/images/groups/d11ea72c16d2cb0aa828c6489aa79fa7.w     document.addEventListener('keydown', e => { if (box.hidden) return; if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') show(at - 1); if (e.key === 'ArrowRight') show(at + 1); });
  }
}
</script>
