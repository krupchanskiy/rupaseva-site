div class="wrap"><ul class="s-facts rv"><li><b>≈400 кг</b><span>весит большая Говардхана-шила</span></li><li><b>≈100</b><span>малых шил пришли вместе с Ним</span></li><li><b>Первая</b><span>постройка в ашраме — Его храм</span></li><li><b>Круглый год</b><span>цветы из Кунджи для поклонения</span></li></ul></div></section><section class="sec gi-tr" id="story"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>История</p><h2 class="caps">Как Гирирадж<br>пришёл к нам</h2></div><div><p class="lead">Прокрутите тропу — точка пройдёт весь путь от пустой земли до нового храма.</p></div></div><div class="gi-path" data-gpath><svg class="gi-svg" viewBox="0 0 100 1000" preserveAspectRatio="none" aria-hidden="true"><path d="M50 0 V1000"/></svg><span class="gi-dot" data-gdot></span><div class="gi-st rv"><span class="gi-n">1</span><div class="gi-tx"><p class="gi-k">Начало</p><h3>Не с забора</h3><p>Когда мы только купили землю, очень хотелось начать строительство ашрама не с забора или трансформаторной будки, а с чего-то более вдохновляющего. Но построить храм на пустой земле непросто: ни электричества, ни воды, ни охраны. Мы молились о решении — и Господь ответил очень необычным образом.</p></div><div class="gi-md"><button type="button" class="gi-ph " data-lb="1" aria-label="Наша земля в самом начале — открыть"><img src="/images/groups/66e46408cc73da73a88ff4fa854e772d.jpg" alt="Наша земля в самом начале" loading="lazy"></button></div></div><div class="gi-st gi-r rv"><span class="gi-n">2</span><div class="gi-tx"><p class="gi-k">Звонок</p><h3>«У нас на участке гости»</h3><p>Однажды наш друг, живущий на Говардхане, позвонил в Москву: «У нас на участке гости». Что мы могли подумать? Ничего хорошего: на пустую землю «в гости» обычно приходят за взяткой или с угрозами. Но друг сказал: «Не надо волноваться, сейчас пришлю фотографию».</p></div><div class="gi-md"><button type="button" class="gi-ph gi-polaroid" data-lb="2" aria-label="Та самая фотография — открыть"><img src="/images/groups/0e97b9e36e24cda3b163a727634295b9.jpg" alt="Та самая фотография" loading="lazy"></button><span class="gi-cap">Та самая фотография</span></div></div><div class="gi-st rv"><span class="gi-n">3</span><div class="gi-tx"><p class="gi-k">Гости</p><h3>Большая шила и сотня малых</h3><p>Это была большая Говардхана-шила — и с ней около сотни шил поменьше. Их аккуратно сложили на обочине у нашей земли, а местные жители сразу начали им поклоняться: украсили лентами и поставили тилаки. «Вчера ничего не было, сегодня приходим — есть».</p></div><div class="gi-md"><button type="button" class="gi-ph " data-lb="3" aria-label="Гирирадж на нашей земле — открыть"><img src="/images/groups/1a1b924338cfe1a03964c2401e4a9cc5.jpg" alt="Гирирадж на нашей земле" loading="lazy"></button></div></div><div class="gi-st gi-r rv"><span class="gi-n">4</span><div class="gi-tx"><p class="gi-k">Автостопом</p><h3>Гирирадж пришёл сам</h3><p>Скорее всего, кто-то рыл фундамент и откопал шилы: Говардхан постепенно уходит под землю. Выбросить Говардхана-шилы как обычные камни нельзя — их повезли к Говардхану, а дальше, может, перевернулась телега. Нам хочется думать, что Гирирадж просто захотел прийти к нам и по традиции добирался «автостопом». Мы перенесли Его в центр участка и провели пуджу, а незнакомый местный мальчик старательно поставил самому большому Гирираджу тилаку.</p></div><div class="gi-md"><blockquote class="gi-q">«Нам хочется думать, что Гирирадж просто захотел прийти к нам»</blockquote></div></div><div class="gi-st rv"><span class="gi-n">5</span><div class="gi-tx"><p class="gi-k">Первый храм</p><h3>Четыре столба и жестяная крыша</h3><p>Первой постройкой на участке стал храм Гирираджа. Архитектура получилась не слишком оригинальной: четыре металлических столба и жестяная крыша. Но праздники в этом храме проходили самые настоящие.</p></div><div class="gi-md"><button type="button" class="gi-ph " data-lb="4" aria-label="Первый храм Гирираджа — открыть"><img src="/images/groups/3fb01f2d9e2deab72550e75414dff21e.jpg" alt="Первый храм Гирираджа" loading="lazy"></button><button type="button" class="gi-ph gi-mini" data-lb="5" aria-label="Праздник в первом храме — открыть"><img src="/images/groups/ab0455a10ff2ab03a70a40dc9fda1858.jpg" alt="Праздник в первом храме" loading="lazy"></button></div></div><div class="gi-st gi-r rv"><span class="gi-n">6</span><div class="gi-tx"><p class="gi-k">Вес</p><h3>400 килограммов</h3><p>Наш Гирирадж весит примерно 400 кг, поэтому передвигается только с помощью крана или трактора.</p></div><div class="gi-md"><button type="button" class="gi-ph " data-lb="6" aria-label="Гирираджа переносят краном — открыть"><img src="/images/groups/09861cd9bf39b1ef7107ab09da5dac67.jpg" alt="Гирираджа переносят краном" loading="lazy"></button></div></div><div class="gi-st rv"><span class="gi-n">7</span><div class="gi-tx"><p class="gi-k">Новый храм</p><h3>Продумана каждая деталь</h3><p>Мы долго проектировали новый храм, прорабатывая каждую деталь, и заодно опробовали технологии, которые будут использованы при строительстве большого храма Шри Шри Радхи-Говинды.</p></div><div class="gi-md"><button type="button" class="gi-ph " data-lb="7" aria-label="Резное окно нового храма — открыть"><img src="/images/groups/2488f3baf55da3eaa8be28eebb392244.jpg" alt="Резное окно нового храма" loading="lazy"></button></div></div></div></div></section><section class="sec gi-mk"><div class="wrap"><div class="hm-rh rv"><div><p class="eb"><i></i>Новый храм Гирираджа</p><h2 class="caps">Как он рождался</h2></div><div class="gi-ar"><button type="button" data-mk-p aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></button><button type="button" data-mk-n aria-label="Вперёд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button></div></div></div><div class="gi-strip" data-mk><figure class="gi-fr" style="--r:-1.5deg"><button type="button" class="gi-ph " data-lb="8" aria-label="Резной узор — открыть"><img src="/images/groups/a27450fbb01ad9567eae12d93d878794.jpg" alt="Резной узор" loading="lazy"></button><figcaption>Резной узор</figcaption></figure><figure class="gi-fr" style="--r:1deg"><button type="button" class="gi-ph " data-lb="9" aria-label="Резчик за работой — открыть"><img src="/images/groups/d1e80097300b6f4a141d9b843d2bc06f.jpg" alt="Резчик за работой" loading="lazy"></button><figcaption>Резчик за работой</figcaption></figure><figure class="gi-fr" style="--r:-0.5deg"><button type="button" class="gi-ph " data-lb="10" aria-label="Каркас храма — открыть"><img src="/images/groups/41bff040a35a7e5af9f0e9f1e01eabcd.jpg" alt="Каркас храма" loading="lazy"></button><figcaption>Каркас храма</figcaption></figure><figure class="gi-fr" style="--r:1.5deg"><button type="button" class="gi-ph " data-lb="11" aria-label="Сборка арок — открыть"><img src="/images/groups/f9b7ad2c996d30256412291b1cff9f88.jpg" alt="Сборка арок" loading="lazy"></button><figcaption>Сборка арок</figcaption></figure><figure class="gi-fr" style="--r:-1.5deg"><button type="button" class="gi-ph " data-lb="12" aria-label="Решётка-джали — открыть"><img src="/images/groups/eb2071c8a2398fccc950aebc8a1fced8.jpg" alt="Решётка-джали" loading="lazy"></button><figcaption>Решётка-джали</figcaption></figure><figure class="gi-fr" style="--r:1deg"><button type="button" class="gi-ph " data-lb="13" aria-label="Джали в мастерской — открыть"><img src="/images/groups/eeb60767b407bb248ebd2fa0b142cbbc.jpg" alt="Джали в мастерской" loading="lazy"></button><figcaption>Джали в мастерской</figcaption></figure><figure class="gi-fr" style="--r:-0.5deg"><button type="button" class="gi-ph " data-lb="14" aria-label="Установка джали — открыть"><img src="/images/groups/f86328234a44313501d5f1850d71edbc.jpg" alt="Установка джали" loading="lazy"></button><figcaption>Установка джали</figcaption></figure><figure class="gi-fr" style="--r:1.5deg"><button type="button" class="gi-ph " data-lb="15" aria-label="Резное окно — открыть"><img src="/images/groups/2488f3baf55da3eaa8be28eebb392244.jpg" alt="Резное окно" loading="lazy"></button><figcaption>Резное окно</figcaption></figure></div></section><section class="sec gi-fs"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>Сегодня</p><h2 class="caps">Центр<br>праздников</h2></div><div><p class="lead">Сейчас храм Гирираджа — центр многочисленных праздников, а деревья нашей Кунджи круглый год приносят цветы для поклонения Ему.</p></div></div><div class="gi-ms rv"><button type="button" class="gi-ph gi-m0" data-lb="16" aria-label="Гирирадж в тюрбане — открыть"><img src="/images/groups/6500135449450367651f89c048765d97.jpg" alt="Гирирадж в тюрбане" loading="lazy"></button><button type="button" class="gi-ph gi-m1" data-lb="17" aria-label="Убранство Гирираджа — открыть"><img src="/images/groups/8e8251ba1c11dfa7b3fc1c619c2af0e7.jpg" alt="Убранство Гирираджа" loading="lazy"></button><button type="button" class="gi-ph gi-m2" data-lb="18" aria-label="Абхишек — открыть"><img src="/images/groups/7802e64a3e55e56793a9d9622579ee64.jpg" alt="Абхишек" loading="lazy"></button><button type="button" class="gi-ph gi-m3" data-lb="19" aria-label="Поклонение Гирираджу — открыть"><img src="/images/groups/4ccb236a8550834d487f647428e583f7.jpg" alt="Поклонение Гирираджу" loading="lazy"></button><button type="button" class="gi-ph gi-m4" data-lb="20" aria-label="Праздник у Гирираджа — открыть"><img src="/images/groups/cd0f0ca57c5d59586f6b34c86d5cdda0.jpg" alt="Праздник у Гирираджа" loading="lazy"></button><button type="button" class="gi-ph gi-m5" data-lb="21" aria-label="Цветы для Гирираджа — открыть"><img src="/images/groups/d2c1fc4b086aba9d51ba13372ee785cf.jpg" alt="Цветы для Гирираджа" loading="lazy"></button><button type="button" class="gi-ph gi-m6" data-lb="22" aria-label="Абхишек всей группой — открыть"><img src="/images/groups/96740f16460b07ab981b1418fb169a83.jpg" alt="Абхишек всей группой" loading="lazy"></button></div></div></section><section class="s-cta"><div class="wrap s-cta-g rv"><div><h2 class="caps">Поклонитесь<br>Гирираджу сами</h2><p>Приезжайте на ретрит в Шри Рупа Сева Кунджу — Гирирадж в нескольких шагах от гостевого дома.</p></div><div class="s-cta-b"><a class="btn btn-sun" href="/new/#retreats">Наши ретриты<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a><div class="s-cta-ch"><a class="btn btn-ghost" href="https://wa.me/79250077575" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5l1.4-4A7.5 7.5 0 1 1 8.6 19z"/><path d="M9 10.5h6M9 13.5h4"/></svg>WhatsApp</a><a class="btn btn-ghost" href="https://t.me/+79250077575" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4L3 11l6.5 2.5L12 20l3-5 4.5 3z"/><path d="M9.5 13.5L21 4"/></svg>Telegram</a><a class="btn btn-ghost" href="mailto:info@rupaseva.ru"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 6.5l8.5 7 8.5-7"/></svg>Email</a></div></div></div></section><section class="sec gi-nx"><div class="wrap"><p class="eb rv"><i></i>Ещё об ашраме</p><div class="gi-nx-g"><a class="gi-nx-c rv" href="#"><span><img src="/images/groups/a3d486051a97a9def9efa4572a69d078.jpg" alt="" loading="lazy"></span><b>Госвами Вриндавана</b><small>Шесть кутиров из земли Враджа</small></a><a class="gi-nx-c rv"
