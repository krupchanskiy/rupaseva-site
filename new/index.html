vg></div><div class="h2-txt"><div class="h2-t0 on" data-mean="-1"><p class="eb"><i></i>Говардхан · Врадж</p><p class="h2-big">Ашрам у подножия Говардхана</p><p class="h2-lead">Место, где вайшнавы живут простой и прекрасной духовной жизнью. Наведите на слово в нашем имени — у каждого свой смысл.</p></div><div class="h2-t" data-mean="0"><p class="h2-w"><b>Шри</b><span>श्री</span><em>красота</em></p><p class="h2-lead">Территория и здания, лекции и киртаны, служение и отношения — всё должно отражать изначальную красоту духовного мира.</p></div><div class="h2-t" data-mean="1"><p class="h2-w"><b>Рупа</b><span>रूप</span><em>форма</em></p><p class="h2-lead">Олицетворение бхакти, которому мы хотим служить: наши ачарьи — Рупа Госвами и Шрила Прабхупада — и прекрасные Шри Шри Радха-Говинда.</p></div><div class="h2-t" data-mean="2"><p class="h2-w"><b>Сева</b><span>सेवा</span><em>служение</em></p><p class="h2-lead">Совершенство жизни и способ к нему приблизиться. Всё, что происходит в ашраме, происходит в духе служения.</p></div><div class="h2-t" data-mean="3"><p class="h2-w"><b>Кунджа</b><span>कुञ्ज</span><em>роща</em></p><p class="h2-lead">Сокровенное пространство, укрытое от суеты и любопытных взглядов, где можно погрузиться в простую и прекрасную духовную жизнь.</p></div></div><button type="button" class="h2-vid" data-video="/images/groups/0dcaaf9e00bcd06b888885c24223cea9.mp4" data-poster="/images/groups/3e60b9d62a0a4858bd586e1b49dfda0c.jpg" aria-label="Видеообращение Шрилы Бхакти Вигьяны Госвами"><span class="hm-vid-c"><img src="/images/groups/9a05b17cafb7b5cc1225b58f649697fd.jpg" alt=""><span class="hm-vid-r"></span><span class="hm-vid-p"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg></span></span><span class="hm-vid-t"><small>Видеообращение</small><b>Шрила Бхакти Вигьяна Госвами о Шри Рупа Сева Кундже</b></span></button></div><a class="h2-down" href="#retreats" aria-label="Листать вниз"><span></span></a></section><section class="sec h2-ret" id="retreats"><div class="wrap"><div class="hm-rh rv"><div><h2 class="caps">Наши ретриты</h2></div><a class="r-host" href="#groups"><span class="r-host-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span><span><small>Для организаторов</small><b>Проведите свой ретрит у нас</b></span></a></div><div class="h2-tk"><a class="h2-t-c rv" href="https://in.rupaseva.com/crm/form.html?retreat=lila-kirtan-2027" target="_blank" rel="noopener" style="--d:0.0s"><img src="/images/groups/4663edde6cbf475fcb139bdd830b00c7.webp" alt="" loading="lazy"><span class="h2-t-sh"></span><span class="h2-t-s"><b>9–18</b><small>марта 2027</small></span><span class="h2-t-b"><small>Ретрит · Шри Рупа Сева Кунджа</small><b>Лила-киртан-ретрит</b><span>Шрила Бхакти Вигьяна Госвами вместе с музыкантами погружает в Кришна-лилу.</span></span><span class="h2-t-go">Записаться<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span></a><a class="h2-t-c rv" href="https://in.rupaseva.com/crm/form.html?retreat=bhagavatam-2027" target="_blank" rel="noopener" style="--d:0.12s"><img src="/images/groups/2aab30ccf1c61d8639134c9f45ecb120.webp" alt="" loading="lazy"><span class="h2-t-sh"></span><span class="h2-t-s"><b>9–27</b><small>августа 2027</small></span><span class="h2-t-b"><small>Ретрит · Шри Рупа Сева Кунджа</small><b>Бхагаватам-ретрит</b><span>Три недели «Шримад-Бхагаватам» у подножия Говардхана.</span></span><span class="h2-t-go">Записаться<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span></a><a class="h2-t-c rv" href="https://in.rupaseva.com/crm/form.html?retreat=radha-govinda-2027" target="_blank" rel="noopener" style="--d:0.24s"><img src="/images/groups/5ce4391698229055cc033a66f36dbb4a.jpg" alt="" loading="lazy"><span class="h2-t-sh"></span><span class="h2-t-s"><b>30</b><small>августа – 12 сентября 2027</small></span><span class="h2-t-b"><small>Ретрит · Шри Рупа Сева Кунджа</small><b>Фестиваль Шри Шри Радхи-Говинды</b><span>Открытие храма: Радха-Говинда приходят в ашрам на Радхаштами.</span></span><span class="h2-t-go">Записаться<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span></a></div></div></section><section class="h2-tm" id="temple" data-sl><div class="h2-tm-tr"><div class="h2-tm-s on" data-sl-i><img src="/images/groups/8bb0e3b2b61514fbf85f71b470540814.jpg" alt="" loading="lazy"><div class="wrap h2-tm-in"><p class="eb"><i></i>Храм Шри Шри Радхи-Говинды<i></i></p><div class="vb-tm-cd"><b data-cd-d>336</b><span>дней до Радхаштами<br>8 сентября 2027</span></div><h2 class="caps">Радха-Говинда придут к нам</h2><p>Воздушные арки, каменные решётки, купола и росписи в традициях Джайпура и Вриндавана. Главный вход обращён к Говардхану.</p><a class="btn btn-sun h2-tm-go" href="/new/temple">О храме →</a></div><span class="vb-tm-note">Визуализация проекта</span></div><div class="h2-tm-s" data-sl-i><img src="/images/groups/7a60bf73f441359da941ea1c1e53ed95.jpg" alt="" loading="lazy"><div class="wrap h2-tm-in"><p class="eb"><i></i>Ретрит художников<i></i></p><h2 class="caps">Весь храм будет расписан</h2><p>Художники-вайшнавы приезжают на ретриты и пишут картины для интерьеров храма. Каждая роспись — подношение Радхе и Говинде.</p><a class="btn btn-sun h2-tm-go" href="/new/temple">О храме →</a></div><span class="vb-tm-note">Эскизы росписей</span></div><div class="h2-tm-s" data-sl-i><img src="/images/groups/5ce4391698229055cc033a66f36dbb4a.jpg" alt="" loading="lazy"><div class="wrap h2-tm-in"><p class="eb"><i></i>Шри Шри Радха-Говинда<i></i></p><h2 class="caps">Божества уже ждут свой храм</h2><p>Радха-Говинда войдут в храм в день Радхаштами 2027 года. Приезжайте на фестиваль открытия.</p><a class="btn btn-sun h2-tm-go" href="/new/temple">О храме →</a></div><span class="vb-tm-note">Фото временное</span></div></div><div class="h2-tm-nav"><button type="button" data-sl-p aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></button><div class="h2-tm-dots"><button type="button" data-sl-d="0" aria-label="Баннер 1"><i></i></button><button type="button" data-sl-d="1" aria-label="Баннер 2"><i></i></button><button type="button" data-sl-d="2" aria-label="Баннер 3"><i></i></button></div><button type="button" data-sl-n aria-label="Вперёд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button></div></section><section class="sec s-places" id="ashram"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>Ашрам</p><h2 class="caps">Вриндаван<br>во Вриндаване</h2></div><div><p class="lead">Мы хотим, чтобы каждый уголок Кунджи был частью Враджа — от Гирираджа в центре до земли под ногами.</p></div></div><div class="h2-as a-acc"><a class="h2-ac rv on" href="/new/ash-giriraj" style="--i:0"><span class="h2-ac-ph"><img src="/images/groups/65de000c0d25ee05c6243cadb127b7d4.jpg" alt="" loading="lazy"><span class="h2-ac-gl"></span></span><span class="h2-ac-vl">Шри Гирирадж</span><span class="h2-ac-tx"><span class="h2-ac-in"><small>Центр Кунджи</small><b>Шри Гирирадж</b><span>Большая Говардхана-шила и около сотни малых шил однажды сами оказались у нашей земли. С Гирираджа и начался ашрам.</span></span></span></a><a class="h2-ac rv" href="/new/ash-goswamis" style="--i:1"><span class="h2-ac-ph"><img src="/images/groups/a3d486051a97a9def9efa4572a69d078.jpg" alt="" loading="lazy"><span class="h2-ac-gl"></span></span><span class="h2-ac-vl">Госвами Вриндавана</span><span class="h2-ac-tx"><span class="h2-ac-in"><small>Шесть кутиров</small><b>Госвами Вриндавана</b><span>Из земли Враджа мы построили шесть кутиров и пригласили в каждый мурти одного из Госвами. Им служат каждый день.</span></span></span></a><a class="h2-ac rv" href="/new/ash-kunj" style="--i:2"><span class="h2-ac-ph"><img src="/images/groups/aef42cce944f56f705915f504bc92f82.jpg" alt="" loading="lazy"><span class="h2-ac-gl"></span></span><span class="h2-ac-vl">Кунджа</span><span class="h2-ac-tx"><span class="h2-ac-in"><small>Сокровенная роща</small><b>Кунджа</b><span>Место для медитации на лилы Господа. Через каменный портал попадаешь в лес Вриндадеви: уже более 10 000 деревьев.</span></span></span></a><a class="h2-ac rv" href="/new/ash-forest" style="--i:3"><span class="h2-ac-ph"><img src="/images/groups/f657c67125b16955ee7252dfef6ec8c8.jpg" alt="" loading="lazy"><span class="h2-ac-gl"></span></span><span class="h2-ac-vl">Лес Враджа</span><span class="h2-ac-tx"><span class="h2-ac-in"><small>36 исконных видов</small><b>Лес Враджа</b><span>Мы изучили шастры и сажаем деревья и кустарники, которые росли здесь во времена Шри Чайтаньи Махапрабху.</span></span></span></a><a class="h2-ac rv" href="/new/ash-soil" style="--i:4"><span class="h2-ac-ph"><img src="/images/groups/905e0870386079fe386621920f83cbea.jpg" alt="" loading="lazy"><span class="h2-ac-gl"></span></span><span class="h2-ac-vl">Почва</span><span class="h2-ac-tx"><span class="h2-ac-in"><small>Служение земле</small><b>Почва</b><span>Поле, годами истощённое химикатами, мы лечим по принципу ахимсы — без удобрений и ядов.</span></span></span></a></div></div></section><section class="sec tm4" id="join"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>Участие</p><h2 class="caps">Станьте частью<br>нашей команды</h2></div><div><p class="lead">Мы рады всем вайшнавам, которым близко настроение Шри Рупа Сева Кунджи. Начать можно с волонтёрства — так мы узнаем друг друга.</p></div></div><div class="tm4-p rv"><span class="tm4-line"><i></i><b class="tm4-dot"></b></span><div class="tm4-s" style="--i:0"><span class="tm4-o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><em>1</em></span><b>Друг проекта</b><p>Молитвы и благословения, приезды на ретриты, помощь посадкам деревьев и кормлению коров.</p><a class="btn" href="/new/join#friends">Как помочь<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a></div><div class="tm4-s" style="--i:1"><span class="tm4-o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-8M12 13c-4 0-6-3-6-7 4 0 6 3 6 7zM12 13c4 0 6-3 6-7-4 0-6 3-6 7z"/></svg><em>2</em></span><b>Волонтёр</b><p>Приезжайте на время послужить: стройка, посадки, кухня и кафе. Опытным — жильё и прасад.</p><a class="btn" href="https://t.me/AnnapurnaSakhidd" target="_blank" rel="noopener">Написать в Telegram<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a></div><div class="tm4-s" style="--i:2"><span class="tm4-o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg><em>3</em></span><b>Команда</b><p>Переезд на Говардхан и служение круглый год. Сейчас ищем повара, садовника и строителя.</p><a class="btn" href="https://t.me/AnnapurnaSakhidd" target="_blank" rel="noopener">Написать в Telegram<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a></div></div><div class="tm4-v rv"><div class="tm4-car" data-car><div class="tm4-hd"><p class="t-sub">Сейчас в команду нужны</p><div class="tm4-ar"><button type="button" data-car-p aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></button><button type="button" data-car-n aria-label="Вперёд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button></div></div><div class="tm4-chips" data-car-t><a href="https://t.me/AnnapurnaSakhidd" target="_blank" rel="noopener" style="--i:0"><b>Повар</b><span>с опытом регулярного приготовления прасада на большое количество вайшнавов</span><em>Откликнуться →</em></a><a href="https://t.me/AnnapurnaSakhidd" target="_blank" rel="noopener" style="--i:1"><b>Садовник</b><span>с большим опытом выращивания деревьев и кустарников и желанием развиваться</span><em>Откликнуться →</em></a><a href="https://t.me/AnnapurnaSakhidd" target="_blank" rel="noopener" style="--i:2"><b>Строитель</b><span>с серьёзным опытом отделочных работ</span><em>Откликнуться →</em></a></div></div></div></div></section><section class="g2 gt g7b" id="groups" data-gt><div class="g2-g"><div class="g2-l rv"><p class="eb"><i></i>Для организаторов</p><h2 class="caps">Проведите<br>свой ретрит<br>у нас</h2><p>Мы берём на себя всё, кроме вашей программы: жильё, прасад, залы, трансферы и быт.</p><ul class="g6-pts"><li><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg></span><div><b>Гостевой дом целиком</b><small>30 номеров, до 72 гостей</small></div></li><li><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18h16M6 18V9h12v9M9 9V6h6v3"/></svg></span><div><b>Залы, крыша и кутиры</b><small>под расписание вашей программы</small></div></li><li><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v10H8l-4 4z"/><path d="M8 10h8M8 13h5"/></svg></span><div><b>Координатор</b><small>говорит по-русски, по-английски и на хинди</small></div></li></ul></div><div class="g2-r gt-r g7b-r rv"><div class="gt-tg" role="tablist"><button type="button" class="on" data-gt-k="vsh" role="tab">Для вайшнавских групп</button><button type="button" class="" data-gt-k="yoga" role="tab">Для йога-групп</button><i></i></div><div class="gt-p on" data-gt-p="vsh"><div class="sp7"><a class="sp7-s on" href="/ru/groups/vaishnava#stay" style="--i:0"><img src="/images/groups/3113a1e8d736df5044be5874cb942190.webp" alt="" loading="lazy"><span class="sp7-sh"></span><span class="sp7-n">01</span><span class="sp7-tx"><b>Проживание</b><span>Гостевой дом-дворец, построенный для вайшнавов</span></span><span class="sp7-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span></a><a class="sp7-s" href="/ru/groups/vaishnava#food" style="--i:1"><img src="/images/groups/67bedd8d27acc7d979ebcfa5e9fe8f34.jpg" alt="" loading="lazy"><span class="sp7-sh"></span><span class="sp7-n">02</span><span class="sp7-tx"><b>Прасад</b><span>Готовят инициированные вайшнавы и предлагают Шри Гирираджу</span></span><span class="sp7-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span></a><a class="sp7-s" href="/ru/groups/vaishnava#worship" style="--i:2"><img src="/images/groups/66f940fc2184c327a8b27b4b8fdfb689.jpg" alt="" loading="lazy"><span class="sp7-sh"></span><span class="sp7-n">03</span><span class="sp7-tx"><b>Поклонение</b><span>Шри Гирирадж, шесть Госвами и Шрила Прабхупада</span></span><span class="sp7-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span></a><a class="sp7-s" href="/ru/groups/vaishnava#spaces" style="--i:3"><img src="/images/groups/753f067109d02e8ed4b87e085a4c00cc.jpg" alt="" loading="lazy"><span class="sp7-sh"></span><span class="sp7-n">04</span><span class="sp7-tx"><b>Кунджа</b><span>Сад Вриндавана: тысячи деревьев и растений Враджа</span></span><span class="sp7-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span></a><a class="sp7-s" href="/ru/groups/vaishnava#programmes" style="--i:4"><img src="/images/groups/2d2880632551baf4c8b7bcb571595436.jpg" alt="" loading="lazy"><span class="sp7-sh"></span><span class="sp7-n">05</span><span class="sp7-tx"><b>Дополнительно</b><span>Святые места рядом, цены и свободные даты</span></span><span class="sp7-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span></a></div><a class="gt-all" href="/ru/groups/vaishnava">Вся страница для вайшнавских групп →</a></div><div class="gt-p" data-gt-p="yoga"><div class="sp7"><a class="sp7-s on" href="/ru/groups/yoga#stay" style="--i:0"><img src="/images/groups/76b19c53a23fce46b44c78cbe20b6707.webp" alt="" loading="lazy"><span class="sp7-sh"></span><span class="sp7-n">01</span><span class="sp7-tx"><b>Проживание</b><span>30 номеров в гостевом доме-дворце, до 72 гостей</span></span><span class="sp7-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span></a><a class="sp7-s" href="/ru/groups/yoga#food" style="--i:1"><img src="/images/groups/67bedd8d27acc7d979ebcfa5e9fe8f34.jpg" alt="" loading="lazy"><span class="sp7-sh"></span><span class="sp7-n">02</span><span class="sp7-tx"><b>Питание</b><span>Вегетарианская кухня, два приёма пищи в день</span></span><span class="sp7-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span></a><a class="sp7-s" href="/ru/groups/yoga#spaces" style="--i:2"><img src="/images/groups/2dbf55462e160a897155de5150815f0b.jpg" alt="" loading="lazy"><span class="sp7-sh"></span><span class="sp7-n">03</span><span class="sp7-tx"><b>Пространства</b><span>Зал, открытая крыша, площадки в Кундже, кутиры</span></span><span class="sp7-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span></a><a class="sp7-s" href="/ru/groups/yoga#service" style="--i:3"><img src="/images/groups/562e38cbf392ad68b05dc3e5ae4862b1.jpg" alt="" loading="lazy"><span class="sp7-sh"></span><span class="sp7-n">04</span><span class="sp7-tx"><b>Сервис</b><span>Трансферы, сим-карты, прачечная — поможем во всём</span></span><span class="sp7-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span></a><a class="sp7-s" href="/ru/groups/yoga#programmes" style="--i:4"><img src="/images/groups/ca372613581498d01b34cd286242dec5.jpg" alt="" loading="lazy"><span class="sp7-sh"></span><span class="sp7-n">05</span><span class="sp7-tx"><b>Дополнительно</b><span>Жизнь ашрама, лекции и парикрамы</span></span><span class="sp7-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span></a></div><a class="gt-all" href="/ru/groups/yoga">Вся страница для йога-групп →</a></div></div></div></section><section class="sec st5" id="settle"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>Скоро · только для вайшнавов</p><h2 class="caps">Ваш дом<br>у Гирираджа</h2></div><div><p class="lead">Рядом с ашрамом появится поселение для вайшнавов. Квартиры для тех, кто хочет жить во Врадже постоянно — в духовной атмосфере и рядом с храмом.</p></div></div><div class="st5-g"><div class="st5-c rv" style="--i:0"><span class="st5-ph"><img src="/images/groups/9da9cb239860699e27ee55db5997b995.webp" alt="" loading="lazy"></span><span class="st5-n">01</span><b>Всё по Васту</b><p>Все квартиры спроектированы с учётом принципов Васту</p></div><div class="st5-c rv" style="--i:1"><span class="st5-ph"><img src="/images/groups/a31c3b15efe5402fa33afdd331edaffb.webp" alt="" loading="lazy"></span><span class="st5-n">02</span><b>Рядом с ашрамом</b><p>Утренняя программа, арати и киртаны, прасад и храм Радхи-Говинды — в нескольких шагах</p></div><div class="st5-c rv" style="--i:2"><span class="st5-ph"><img src="/images/groups/d11ea72c16d2cb0aa828c6489aa79fa7.webp" alt="" loading="lazy"></span><span class="st5-n">03</span><b>Среди вайшнавов</b><p>Соседи, с которыми вас объединяет практика: жителей выбираем через собеседование</p></div><div class="st5-c rv" style="--i:3"><span class="st5-ph"><img src="/images/groups/ef8b279003dd4da74e1581ac4af702d0.webp" alt="" loading="lazy"></span><span class="st5-n">04</span><b>У подножия Гирираджа</b><p>Говардхан, тропа парикрамы и Кунджа — каждый день рядом</p></div></div><div class="st5-cta rv"><p>Расскажем о проекте и пришлём презентацию, когда будут готовы основные параметры.</p><a class="btn btn-sun" href="/new/contacts">Узнать о проекте<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a></div></div></section><section class="sec sb" id="seva"><div class="wrap"><p class="eb rv"><i></i>Наше служение</p><h2 class="caps rv s-h">Служим Враджу<br>и вайшнавам</h2><ul class="sb-l"><li class="rv"><a href="/new/brajcare"><span class="s1-n">01</span><b>BrajCare</b><span class="sb-d">Помогаем вам служить Враджу</span><img src="/images/groups/0da0101c0a5cfea2ccaf0d53f469d313.jpg" alt="" loading="lazy"><small>Служение</small></a></li><li class="rv"><a href="/new/vedarama"><span class="s1-n">02</span><b>Vedarama</b><span class="sb-d">Вайшнавская электронная библиотека</span><img src="/images/groups/1c3c586faa8b8c548413843a7adcc622.jpg" alt="" loading="lazy"><small>Приложение</small></a></li><li class="rv"><a href="/new/bhajanamrita"><span class="s1-n">03</span><b>Bhajanamrita</b><span class="sb-d">Бхаджаны с переводами и мелодиями</span><img src="/images/groups/1052290b94ffcab161a869aff554acb1.jpg" alt="" loading="lazy"><small>Сайт и приложение</small></a></li><li class="rv"><a href="https://slokamrita.com" target="_blank" rel="noopener"><span class="s1-n">04</span><b>Slokamrita</b><span class="sb-d">Учим шлоки наизусть</span><span class="sb-em">S</span><small>Сайт и приложение</small></a></li><li class="rv"><a href="/new/vrajapedia"><span class="s1-n">05</span><b>Vrajapedia</b><span class="sb-d">Энциклопедия Враджа</span><span class="sb-em">V</span><small>Сайт</small></a></li><li class="rv"><a href="/new/shad-goswami"><span class="s1-n">06</span><b>Шад Госвами</b><span class="sb-d">Многосерийный фил     $$('.sp7').forEach(s => { let tm; const it = $$('.sp7-s', s); it.forEach(x => x.addEventListener('mouseenter', () => { clearTimeout(tm); tm = setTimeout(() => it.forEach(y => y.classList.toggle('on', y === x)), 120); })); });
    // меню на телефоне
    const sh = $('.hm-sh'), bg = $('[data-burg]');
    if (bg) { bg.addEventListener('click', () => sh.classList.toggle('open')); $$('[data-mob-x]').forEach(a => a.addEventListener('click', () => sh.classList.remove('open'))); }
    // первый экран: случайное фото
    const hb = $('[data-hero]'); if (hb) { try { const pool = JSON.parse(hb.dataset.hero); hb.src = pool[Math.floor(Math.random() * pool.length)]; } catch (e) {} }
    // отсчёт до открытия храма (8 сентября 2027, Радхаштами)
    const cd = $('[data-cd-d]'); if (cd) { const t = new Date(2027, 8, 8), n = new Date(); n.setHours(0, 0, 0, 0); cd.textContent = Math.max(0, Math.round((t - n) / 864e5)); }

    // появление при прокрутке
    if ('IntersectionObserver' in window) { 
      const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 });
      $$('.rv').forEach(el => { const r = el.getBoundingClientRect(); if (r.top < innerHeight) el.classList.add('in'); else io.observe(el); });
      setTimeout(() => $$('.rv').forEach(el => el.classList.add('in')), 2600); }
    // «Связаться»
    const ct = $('.sh-ct') || document.createElement('div'), ctb = $('[data-ct]') || document.createElement('button');
    ctb.addEventListener('click', e => { e.stopPropagation(); const o = ct.classList.toggle('open'); ctb.setAttribute('aria-expanded', o); });
    document.addEventListener('click', e => { if (!ct.contains(e.target)) { ct.classList.remove('open'); ctb.setAttribute('aria-expanded', 'false'); } });
    // номера: миниатюры
    $$('[data-room]').forEach(r => { const main = $('[data-room-main]', r);
      $$('.rm-th button', r).forEach(b => b.addEventListener('click', () => { main.src = b.dataset.src; main.alt = b.dataset.alt; $$('.rm-th button', r).forEach(x => x.classList.toggle('on', x === b)); })); });
    // галерея: вкладки
    $$('[data-gt]').forEach(b => b.addEventListener('click', () => { $$('[data-gt]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b); }); $$('[data-gp]').forEach(p => p.classList.toggle('on', p.dataset.gp === b.dataset.gt)); }));
    // лайтбокс
    const box = $('[data-lb-box]'), im = $('[data-lb-img]'), cap = $('[data-lb-cap]'); let at = 0;
    const show = i => { at = (i + LB.length) % LB.length; im.src = LB[at][0]; im.alt = LB[at][1]; cap.textContent = LB[at][1]; };
    const open = i => { show(i); box.hidden = false; document.documentElement.style.overflow = 'hidden'; };
    const close = () => { box.hidden = true; document.documentElement.style.overflow = ''; };
    document.addEventListener('click', e => { const t = e.target.closest && e.target.closest('[data-lb]'); if (t && !box.contains(t)) open(+t.dataset.lb);
      const rm = e.target.closest && e.target.closest('.rm-ph'); if (rm) { const src = $('img', rm).getAttribute('src'); const i = LB.findIndex(x => x[0] === src); open(i >= 0 ? i : 0); } });
    $('[data-lb-x]').addEventListener('click', close);
    // видео на весь экран
    document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-video]'); if (!b) return;
      const vl = document.createElement('div'); vl.className = 'vl';
      vl.innerHTML = '<video controls autoplay playsinline preload="auto"></video><button type="button" class="lb-x" aria-label="Закрыть">×</button>';
      const v = vl.querySelector('video'); v.poster = b.dataset.poster; v.src = b.dataset.video;
      const shut = () => { v.pause(); vl.classList.remove('on'); document.documentElement.style.overflow = ''; document.removeEventListener('keydown', key); setTimeout(() => vl.remove(), 400); };
      const key = ev => { if (ev.key === 'Escape') shut(); };
      vl.addEventListener('click', ev => { if (ev.target !== v) shut(); }); document.addEventListener('keydown', key);
      document.body.appendChild(vl); document.documentElement.style.overflow = 'hidden'; setTimeout(() => vl.classList.add('on'), 20);
      const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); }); $('[data-lb-p]').addEventListener('click', () => show(at - 1)); $('[data-lb-n]').addEventListener('click', () => show(at + 1));
    box.addEventListener('click', e => { if (e.target === box) close(); });
    document.addEventListener('keydown', e => { if (box.hidden) return; if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') show(at - 1); if (e.key === 'ArrowRight') show(at + 1); });
  }
}
</script>
</body>
</html>
