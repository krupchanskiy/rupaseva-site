    document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-video]'); if (!b) return;
      const vl = document.createElement('div'); vl.className = 'vl';
      vl.innerHTML = '<video controls autoplay playsinline preload="auto"></video><button type="button" class="lb-x" aria-label="Закрыть">×</button>';
      const v = vl.querySelector('video'); v.poster = b.dataset.poster; v.src = b.dataset.video;
      const shut = () => { v.pause(); vl.classList.remove('on'); document.documentElement.style.overflow = ''; document.removeEventListener('keydown', key); setTimeout(() => vl.remove(), 400); };
      const key = ev => { if (ev.key === 'Escape') shut(); };
      vl.addEventListener('click', ev => { if (ev.target !== v) shut(); }); document.addEventListener('keydown', key);
      document.body.appendChild(vl); document.documentElement.style.overflow = 'hidden'; setTimeout(() => vl.classList.add('on'), 20);
      const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); }); $('[data-lb-p]').addEventListener('click', () => show(at - 1)); $('[data-lb-n]').addEventListener('click', () => show(at + 1));
    box.addEventListener('click', e => { if (e.target === box) close(); });
    document.addEventListener('keydown', e => { if (box.hidden) return; if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') show(at - 1); if (e.key === 'ArrowRight') show(at + 1); });
  }
}
</script>
</body>
