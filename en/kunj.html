/div></div><button type="button" class="hm-burg" aria-label="Menu" data-burg><i></i><i></i></button></div></div><div class="hm-mob" data-mob><nav><a href="/en/#retreats" data-mob-x>Retreats</a><a href="/en/#temple" data-mob-x>Temple</a><a href="/en/#ashram" data-mob-x>Ashram</a><a href="/en/#groups" data-mob-x>For groups</a><a href="/en/#seva" data-mob-x>Our seva</a><a href="/en/join-us" data-mob-x>Join us</a><a href="/en/contacts" data-mob-x>Contacts</a></nav><div class="hm-mob-c"><a class="btn " href="https://wa.me/79250077575" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5l1.4-4A7.5 7.5 0 1 1 8.6 19z"/><path d="M9 10.5h6M9 13.5h4"/></svg>WhatsApp</a><a class="btn " href="https://t.me/+79250077575" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4L3 11l6.5 2.5L12 20l3-5 4.5 3z"/><path d="M9.5 13.5L21 4"/></svg>Telegram</a><a class="btn " href="mailto:info@rupaseva.ru"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 6.5l8.5 7 8.5-7"/></svg>Email</a></div></div></header><main><section class="s-hero gi-hero"><div class="wrap s-hero-g"><div class="s-hero-t rv"><p class="eb"><i></i>Ashram · the secluded grove</p><h1 class="caps">The Kunj</h1><p class="lead">Kunjas are secret forest groves where Sri Sri Radha and Govinda enjoy Their pastimes. Our Kunj is a place to meditate on the lilas of the Lord and His eternal associates.</p></div><figure class="s-hero-ph gi-hero-ph rv"><button type="button" class="gi-ph " data-lb="0" aria-label="The stone gateway into the Kunj — open"><img src="/images/groups/aef42cce944f56f705915f504bc92f82.jpg" alt="The stone gateway into the Kunj" loading="lazy"></button></figure></div><div class="wrap"><ul class="s-facts rv"><li><b>10,000+</b><span>trees planted at the ashram so far</span></li><li><b>6 kutirs</b><span>bhajan kutirs of the Goswamis of Vrindavan</span></li><li><b>2 kundas</b><span>Radha and Shyama, plus a fish pond and a waterfall</span></li><li><b>≈100</b><span>Vaishnavas can study scripture here at the same time</span></li></ul></div></section><section class="sec kj-ba"><div class="wrap kj-ba-g"><div class="rv"><p class="eb"><i></i>Before and after</p><h2 class="caps">The forest<br>we planted</h2><p class="lead">So far we have planted more than 10,000 trees, and we have no intention of stopping!</p><p class="kj-p">The Kunj is enclosed by a dense green “wall” of plants native to Vraja. Step through the stone gateway and you find yourself in a true Vrinda-van — the forest of Vrindadevi.</p></div><div class="kj-cmp rv" data-cmp style="--p:50%"><img src="/images/groups/ebb89fc7baa802e48f40c069252c8d5d.jpg" alt="The Kunj today" loading="lazy"><div class="kj-cmp-b"><img src="/images/groups/e811e15b9092c4b9cfc515cd8d3638f3.jpg" alt="Bare ground before planting" loading="lazy"></div><span class="kj-cmp-h"><i></i></span><small class="kj-cmp-l">Before</small><small class="kj-cmp-r">After</small><input type="range" min="0" max="100" value="50" aria-label="Compare before and after"></div></div></section><section class="sec kj-wk"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>A walk</p><h2 class="caps">Along the paths<br>of the Kunj</h2></div><div><p class="lead">Six stops from the gateway to the kutirs. Press “Walk on” to continue.</p></div></div><div class="kj-wk-g rv" data-walk><div class="kj-wk-ph"><img class="on" data-wi="0" src="/images/groups/8dbac86d1d0a3db541d096dde78cc4ef.jpg" alt="The stone gateway" loading="lazy"><img class="" data-wi="1" src="/images/groups/45999a9ada5d99f59a9ada757555a94a.jpg" alt="The green wall" loading="lazy"><img class="" data-wi="2" src="/images/groups/cbf276bc9dbd34ea25b212c367e47179.jpg" alt="The Giriraj temple" loading="lazy"><img class="" data-wi="3" src="/images/groups/d17d7cecd32ca8cf3510f54d318741aa.jpg" alt="Kundas, pond and waterfall" loading="lazy"><img class="" data-wi="4" src="/images/groups/5b6aec28e73309b891f4a07f2f439220.jpg" alt="Bhajan kutirs" loading="lazy"><img class="" data-wi="5" src="/images/groups/568152cf3c86237fe0e079b2f7de4915.jpg" alt="The discussion circle" loading="lazy"></div><div class="kj-wk-t"><div class="kj-wk-tx"><div class="kj-wk-s on" data-wi="0"><span class="kj-wk-n">01<small> / 06</small></span><h3>The stone gateway</h3><p>The stone gateway marks the entrance to the Kunj. Pass through it and you enter the forest of Vrindadevi. A small temple of Kunjeshvara Mahadeva will be built beside the entrance.</p></div><div class="kj-wk-s" data-wi="1"><span class="kj-wk-n">02<small> / 06</small></span><h3>The green wall</h3><p>The Kunj is encircled by a dense wall of more than 8,000 plants native to Vraja. Green tunnels lead you deeper in.</p></div><div class="kj-wk-s" data-wi="2"><span class="kj-wk-n">03<small> / 06</small></span><h3>The Giriraj temple</h3><p>At the heart of the Kunj stands the temple of Giriraj. <a href="/en/giriraj">The story of how He came to us</a> deserves a page of its own.</p></div><div class="kj-wk-s" data-wi="3"><span class="kj-wk-n">04<small> / 06</small></span><h3>Kundas, pond and waterfall</h3><p>We have our own small Radha-kunda and Shyama-kunda, as well as a fish pond. For Giriraj’s pleasure, a little waterfall graces the bank of Shyama-kunda just opposite the temple — a delight to the eye that also keeps the water oxygenated.</p></div><div class="kj-wk-s" data-wi="4"><span class="kj-wk-n">05<small> / 06</small></span><h3>Bhajan kutirs</h3><p>Narrow stone paths lead to traditional Vrindavan mud kutirs with thatched roofs. Their walls are about 80 cm thick, so the kutirs stay cool in summer and warm in winter.</p></div><div class="kj-wk-s" data-wi="5"><span class="kj-wk-n">06<small> / 06</small></span><h3>The discussion circle</h3><p>People come to the kutirs to chant japa, sing kirtan and study the scriptures together. Lectures achieve little without discussion in small groups, and the six kutirs allow around a hundred Vaishnavas to gather for this kind of study. <a href="/en/kutirs">Read about the murtis of the Goswamis in the kutirs</a>.</p></div></div><div class="kj-wk-b"><button type="button" class="kj-wk-pv" data-wstep="-1" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button><button type="button" class="btn btn-sun" data-wstep="1">Walk on<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button></div><ol class="kj-wk-tr"><li><button type="button" class="on" data-wgo="0"><i></i><small>Stone gateway</small></button></li><li><button type="button" class="" data-wgo="1"><i></i><small>Green wall</small></button></li><li><button type="button" class="" data-wgo="2"><i></i><small>Giriraj temple</small></button></li><li><button type="button" class="" data-wgo="3"><i></i><small>Kundas, pond and waterfall</small></button></li><li><button type="button" class="" data-wgo="4"><i></i><small>Bhajan kutirs</small></button></li><li><button type="button" class="" data-wgo="5"><i></i><small>Discussion circle</small></button></li></ol></div></div></div></section><section class="sec kj-cl"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>Kutir gardens</p><h2 class="caps">Each kutir has<br>its own color</h2></div><div><p class="lead">Each kutir is surrounded by carefully chosen plants that match the color of its Goswami’s siddha-svarupa.</p></div></div><div class="kj-cl-g rv"><article class="kj-c kj-c-red"><span class="kj-c-ph"><img src="/images/groups/fb90592cc587d38f64e4bc6296630f3a.jpg" alt="" loading="lazy"></span><div class="kj-c-t"><small>Red</small><h3>Srila Sanatana Goswami</h3><b>Lavanga Manjari</b><p>Mandara, palash, krishnachuda, red kovidara, semal, pomegranate</p></div></article><article class="kj-c kj-c-white"><span class="kj-c-ph"><img src="/images/groups/1014553dec56d1a4c3bcd7f8be2b8a78.jpg" alt="" loading="lazy"></span><div class="kj-c-t"><small>White</small><h3>Srila Raghunatha Dasa Goswami</h3><b>Rati Manjari</b><p>Surrounded by white-flowering trees and shrubs</p></div></article><article class="kj-c kj-c-yellow"><span class="kj-c-ph"><img src="/images/groups/f4b14b1cd19022307991f621e64d5992.jpg" alt="" loading="lazy"></span><div class="kj-c-t"><small>Yellow</small><h3>Srila Gopal Bhatta Goswami</h3><b>Guna Manjari</b><p>Surrounded by yellow-flowering trees and shrubs</p></div></article></div></div></section><section class="sec kj-tg"><div class="wrap kj-tg-g"><div class="rv"><p class="eb"><i></i>Plants from the shastras</p><h2 class="caps">A forest you<br>can learn from</h2><p class="lead">More than 80 species of trees and shrubs growing in our Kunj are mentioned in the shastras.</p><p class="kj-p">The trees already carry QR codes that link to Vrajapedia.com, our project on the plants of Vraja, where you’ll find photos of their flowers and fruit, their properties and quotations from the shastras. In this way the forest itself becomes a place of learning.</p><a class="btn btn-sun kj-vp" href="https://vrajapedia.com" target="_blank" rel="noopener">Visit Vrajapedia<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a><ul class="kj-num"><li><b>280+</b><span>species of trees<br>and shrubs</span></li><li><b>80+</b><span>of them<br>mentioned in the shastras</span></li><li><b>15+</b><span>varieties<br>of mango</span></li><li><b>8,000+</b><span>plants<br>in the “green wall”</span></li></ul></div><div class="kj-tag rv"><span class="kj-tag-ph"><img src="/images/groups/fb90592cc587d38f64e4bc6296630f3a.jpg" alt="" loading="lazy"></span><div class="kj-tag-c"><i class="kj-tag-hole"></i><svg viewBox="0 0 21 21" aria-hidden="true"><rect x="0" y="0" width="1" height="1"/><rect x="1" y="0" width="1" height="1"/><rect x="2" y="0" width="1" height="1"/><rect x="3" y="0" width="1" height="1"/><rect x="4" y="0" width="1" height="1"/><rect x="5" y="0" width="1" height="1"/><rect x="6" y="0" width="1" height="1"/><rect x="8" y="0" width="1" height="1"/><rect x="10" y="0" width="1" height="1"/><rect x="12" y="0" width="1" height="1"/><rect x="13" y="0" width="1" height="1"/><rect x="14" y="0" width="1" height="1"/><rect x="15" y="0" width="1" height="1"/><rect x="16" y="0" width="1" height="1"/><rect x="17" y="0" width="1" height="1"/><rect x="18" y="0" width="1" height="1"/><rect x="0" y="1" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="9" y="1" width="1" height="1"/><rect x="12" y="1" width="1" height="1"/><rect x="18" y="1" width="1" height="1"/><rect x="0" y="2" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/><rect x="8" y="2" width="1" height="1"/><rect x="9" y="2" width="1" height="1"/><rect x="10" y="2" width="1" height="1"/><rect x="12" y="2" width="1" height="1"/><rect x="14" y="2" width="1" height="1"/><rect x="15" y="2" width="1" height="1"/><rect x="16" y="2" width="1" height="1"/><rect x="18" y="2" width="1" height="1"/><rect x="0" y="3" width="1" height="1"/><rect x="2" y="3" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="4" y="3" width="1" height="1"/><rect x="6" y="3" width="1" height="1"/><rect x="12" y="3" width="1" height="1"/><rect x="14" y="3" width="1" height="1"/><rect x="15" y="3"
