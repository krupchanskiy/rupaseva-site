lass="hm-burg" aria-label="Menu" data-burg><i></i><i></i></button></div></div><div class="hm-mob" data-mob><nav><a href="/en/#retreats" data-mob-x>Retreats</a><a href="/en/#temple" data-mob-x>Temple</a><a href="/en/#ashram" data-mob-x>Ashram</a><a href="/en/#groups" data-mob-x>For groups</a><a href="/en/#seva" data-mob-x>Our seva</a><a href="/en/join-us" data-mob-x>Join us</a><a href="/en/contacts" data-mob-x>Contacts</a></nav><div class="hm-mob-c"><a class="btn " href="https://wa.me/79250077575" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5l1.4-4A7.5 7.5 0 1 1 8.6 19z"/><path d="M9 10.5h6M9 13.5h4"/></svg>WhatsApp</a><a class="btn " href="https://t.me/+79250077575" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4L3 11l6.5 2.5L12 20l3-5 4.5 3z"/><path d="M9.5 13.5L21 4"/></svg>Telegram</a><a class="btn " href="mailto:info@rupaseva.ru"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 6.5l8.5 7 8.5-7"/></svg>Email</a></div></div></header><main><section class="s-hero"><div class="wrap s-hero-g"><div class="s-hero-t rv"><p class="eb"><i></i>Accommodation</p><h1 class="caps">A palace<br>built for<br>Vaishnavas</h1><p class="lead">A guesthouse in the old Jaipur style, with altar niches for the Deities you bring with you, views of Giriraj from the upstairs balconies, and the quiet you need for sadhana.</p></div><figure class="s-hero-ph rv"><img src="/images/groups/3113a1e8d736df5044be5874cb942190.webp" alt="The guesthouse courtyard at sunset" data-lb="0"></figure></div><div class="wrap"><ul class="s-facts rv"><li><b>30</b><span>rooms: 24 doubles and 6 four-bed rooms</span></li><li><b>72</b><span>guests — the most the house ever holds at once</span></li><li><b>14:00 / 12:00</b><span>check-in and check-out — times are flexible</span></li><li><b>Every</b><span>room has a private bathroom and air conditioning</span></li></ul></div></section><section class="sec s-house" id="house"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>The guesthouse</p><h2 class="caps">Nothing to get<br>in the way of sadhana</h2></div><div><p class="lead">Many people who come to India find everyday life here hard to get used to: paint flakes off the walls, appliances burn out the moment they’re plugged in, and the noise goes on day and night. The body protests, the mind grows restless, and it becomes hard to go deep into sadhana.</p></div></div><button type="button" class="hv rv" data-video="/videos/groups/stay-room-1080.mp4" data-poster="/images/groups/6d749a3f00bac57cbc61b0676912bdeb.jpg" aria-label="Watch a video about the guesthouse"><img src="/images/groups/6d749a3f00bac57cbc61b0676912bdeb.jpg" alt="" loading="lazy"><span class="hv-sh"></span><span class="hv-pl"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg></span><span class="hv-t"><b>The guesthouse on video</b></span></button><div class="s-house-g"><div class="s-house-txt rv"><p>When we designed the house, we wanted to spare our guests these worries and bring together Western comfort and traditional Indian aesthetics. Every detail was made with love — we even built our own factory to cast the carved elements from fiber-reinforced concrete.</p><p>Thick double walls and double-glazed windows keep the rooms quiet and the temperature steady. The walls are finished the old way, with lime plaster.</p><p>On the ground floor, every room has its own small balcony and garden, so no one walks past right under your windows. The upstairs balconies look out on Giriraj. And each room has an altar niche for the Deities our guests bring with them.</p></div><ul class="s-am rv"><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5s6 6.4 6 10.5a6 6 0 0 1-12 0c0-4.1 6-10.5 6-10.5z"/></svg></span><b>Hot water all day</b><p>Every bathroom has its own water heater, so hot water isn’t just for the mornings.</p></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg></span><b>Backup generator</b><p>Starts automatically if the power goes out.</p></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/><path d="M9.5 4.5L12 6.5l2.5-2M9.5 19.5l2.5-2 2.5 2"/></svg></span><b>Air conditioning in every room</b><p>Cool in the heat, warm on winter nights.</p></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4-1.5v-5z"/></svg></span><b>Clean water</b><p>The local water is hard and salty, so we treat it: all the water in the house is filtered and salt-free — even in the shower.</p></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5a12 12 0 0 1 17 0M6.5 12.7a7.5 7.5 0 0 1 11 0M9.5 15.8a3.2 3.2 0 0 1 5 0"/><circle cx="12" cy="18.6" r=".6" fill="currentColor"/></svg></span><b>Wi-Fi</b><p>In the rooms and at reception.</p></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14M6.5 17a5.5 5.5 0 0 1 11 0M12 9.5V8M10.5 8h3M4 20h16"/></svg></span><b>Reception and laundry</b><p>Reception is always there to help, and we’ll take care of your laundry.</p></li></ul></div></div></section><section class="sec s-rooms" id="rooms"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>Rooms</p><h2 class="caps">Two kinds<br>of rooms</h2></div><div><p class="lead">Real photos, no 3D renderings. Every room has a private bathroom and air conditioning, towels and fresh linen, soap and shower gel, and a water jug. A hair dryer and an iron are available on request.</p></div></div><div class="rm-g"><div class="rm rv" data-room="twin"><div class="rm-ph"><img src="/images/groups/76b19c53a23fce46b44c78cbe20b6707.webp" alt="Double room" data-room-main></div><div class="rm-th"><button type="button" class="on" data-src="/images/groups/76b19c53a23fce46b44c78cbe20b6707.webp" data-alt="Double room" aria-label="Double room"><img src="/images/groups/76b19c53a23fce46b44c78cbe20b6707.webp" alt=""></button><button type="button" class="" data-src="/images/groups/1e74a0a674862392aaf63a3a43e66001.webp" data-alt="Two beds and an altar niche" aria-label="Two beds and an altar niche"><img src="/images/groups/1e74a0a674862392aaf63a3a43e66001.webp" alt=""></button><button type="button" class="" data-src="/images/groups/b48251069d43cd97a817a87d41d8601e.webp" data-alt="Private bathroom" aria-label="Private bathroom"><img src="/images/groups/b48251069d43cd97a817a87d41d8601e.webp" alt=""></button><button type="button" class="" data-src="/images/groups/9345b11f48a3306e76ada8ea70ddaa55.webp" data-alt="View from the balcony" aria-label="View from the balcony"><img src="/images/groups/9345b11f48a3306e76ada8ea70ddaa55.webp" alt=""></button></div><h3>Double room</h3><p class="rm-c">24 rooms · 2 guests each</p></div><div class="rm rv" data-room="quad"><div class="rm-ph"><img src="/images/groups/a9de499abefc2e1c37f07fab13585f61.webp" alt="Four-bed room" data-room-main></div><div class="rm-th"><button type="button" class="on" data-src="/images/groups/a9de499abefc2e1c37f07fab13585f61.webp" data-alt="Four-bed room" aria-label="Four-bed room"><img src="/images/groups/a9de499abefc2e1c37f07fab13585f61.webp" alt=""></button><button type="button" class="" data-src="/images/groups/7d3392510158fd2b6d61ff6046bbdbc4.webp" data-alt="Sitting area" aria-label="Sitting area"><img src="/images/groups/7d3392510158fd2b6d61ff6046bbdbc4.webp" alt=""></button><button type="button" class="" data-src="/images/groups/afae1739e8e836e29c55d0aa386b40d1.webp" data-alt="Writing desk" aria-label="Writing desk"><img src="/images/groups/afae1739e8e836e29c55d0aa386b40d1.webp" alt=""></button><button type="button" class="" data-src="/images/groups/3886e9433c145c653867c914b1065a2e.webp" data-alt="Bathroom" aria-label="Bathroom"><img src="/images/groups/3886e9433c145c653867c914b1065a2e.webp" alt=""></button></div><h3>Four-bed room</h3><p class="rm-c">6 rooms · 4 guests each</p></div></div><dl class="rm-t rv"><div class="rm-r"><dt>How many</dt><dd>24 rooms: 20 on the ground floor, 4 upstairs</dd><dd>6 rooms, all upstairs</dd></div><div class="rm-r"><dt>Beds</dt><dd>Two single beds with IKEA mattresses</dd><dd>Two bunk beds with easy-to-climb ladders; every bed has its own lamp and power outlets</dd></div><div class="rm-r"><dt>Bathroom</dt><dd>Private, with hot water</dd><dd>Private, with hot water</dd></div><div class="rm-r"><dt>Wardrobes and mirrors</dt><dd>Two wardrobes, large mirrors</dd><dd>Four wardrobes, large mirrors</dd></div><div class="rm-r"><dt>For relaxing</dt><dd>A corner with rattan armchairs and a small table</dd><dd>A sitting area with a sofa, armchairs and a coffee table; a writing desk</dd></div><div class="rm-r"><dt>Special features</dt><dd>A wall niche for your altar</dd><dd>Kitchenette with a sink</dd></div><div class="rm-r"><dt>Balcony and view</dt><dd>Ground floor: your own balcony and small garden; upstairs: a view of Giriraj</dd><dd>Balcony with a view of Giriraj</dd></div><div class="rm-r"><dt>Air conditioning</dt><dd>Yes</dd><dd>Yes</dd></div></dl></div></section><section class="sec s-info" id="info"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>Staying with us</p><h2 class="caps">Good to know<br>before you come</h2></div><div></div></div><ul class="s-info-g rv"><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span><div><b>Check-in and check-out</b><p>Check-in is from 14:00 and check-out by 12:00. If your flight is earlier or later, just let us know — we can work it out.</p></div></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></svg></span><div><b>Housekeeping and linen</b><p>We clean your room and change the linen on request, whenever it suits you.</p></div></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v16H6z"/><path d="M6 9h12M9.5 13.5h5"/></svg></span><div><b>In your room</b><p>Towels and linen, soap and shower gel, a water jug, wardrobes (four in the four-bed rooms) and large mirrors. A hair dryer and an iron are available from reception on request.</p></div></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="6" r="2.5"/><path d="M8 21v-5l-2-3 3-3h6l3 3-2 3v5M10.5 21v-4h3v4"/></svg></span><div><b>Children</b><p>We can add an extra bed for a child — best to arrange this in advance.</p></div></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8l-1 3 2 2v10a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V9l2-2z"/><path d="M17 11h1.5a1.5 1.5 0 0 1 0 3H17"/></svg></span><div><b>Water</b><p>All the water in the house is filtered and salt-free — even in the shower. You can refill the jug in your room with drinking water at any time.</p></div></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14M6.5 17a5.5 5.5 0 0 1 11 0M12 9.5V8M10.5 8h3M4 20h16"/></svg></span><div><b>Reception</b><p>The staff can help with keys, laundry, taxis and anything else you need.</p></div></li></ul><div class="s-rules rv"><div class="s-rules-h"><p class="eb"><i></i>Ashram rules</p><p class="s-rules-l">The ashram is a sacred place, and we take care to protect its atmosphere. We ask every guest to observe three rules.</p></div><ul><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z"/><path d="M5 19l8-8"/></svg></span><b>No meat, fish or eggs</b><p>Only vegetarian food is allowed on the grounds.</p></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10l-1 16H8z"/><path d="M4 4l16 16"/></svg></span><b>No intoxicants</b><p>No alcohol, tobacco or any other intoxicating substances.</p></li><li><span class="s-am-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3l3 3 3-3 4 3-2 4-2-1v12H9V9l-2 1-2-4z"/></svg></span><b>Modest dress</b><p>As is customary at India’s holy places, please keep your shoulders and knees covered.</p></li></ul></div></div></section><section class="sec s-gal" id="photos"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>Photos</p><h2 class="caps">The guesthouse<br>as it really is</h2></div><div><p class="lead">Every photo was taken at the ashram. No AI-generated images, no stock pictures.</p></div></div><div class="gl-tabs rv" role="tablist"><button type="button" class="on" data-gt="0" role="tab" aria-selected="true">Courtyard and garden</button><button type="button" class="" data-gt="1" role="tab" aria-selected="false">Rooms</button><button type="button" class="" data-gt="2" role="tab" aria-selected="false">Bathrooms and details</button><button type="button" class="" data-gt="3" role="tab" aria-selected="false">Rooftop and views</button></div><div class="gl rv"><div class="gl-p on" data-gp="0"><button type="button" class="gl-it" style="--ar:1.5" data-lb="1"><img src="/images/groups/3113a1e8d736df5044be5874cb942190.webp" alt="The courtyard at sunset" loading="lazy"><span>The courtyard at sunset</span></button><button type="button" class="gl-it" style="--ar:1.5" data-lb="2"><img src="/images/groups/724c2e217c8ba70e8c2dd242560ac760.webp" alt="The garden in front of the guesthouse" loading="lazy"><span>The garden in front of the guesthouse</span></button><button type="button" class="gl-it" style="--ar:1.5" data-lb="3"><img src="/images/groups/79e2f02ff951a3855ceb97336082d653.webp" alt="The facade" loading="lazy"><span>The facade</span></button><button type="button" class="gl-it" style="--ar:1.5" data-lb="4"><img src="/images/groups/d11ea72c16d2cb0aa828c6489aa79fa7.webp" alt="Guests in the courtyard" loading="lazy"><span>Guests in the courtyard</span></button><button type="button" class="gl-it" style="--ar:1.333" data-lb="5"><img src="/images/groups/cfda67a7ae33fb92a8de8d9c356fc824.webp" alt="The guesthouse at night" loading="lazy"><span>The guesthouse at night</span></button></div><div class="gl-p" data-gp="1"><button type="button" class="gl-it" style="--ar:1.5" data-lb="6"><img src="/images/groups/76b19c53a23fce46b44c78cbe20b6707.webp" alt="Double room" loading="lazy"><span>Double room</span></button><button type="button" class="gl-it" style="--ar:1.5" data-lb="7"><img src="/images/groups/1e74a0a674862392aaf63a3a43e66001.webp" alt="Two beds and an altar niche" loading="lazy"><span>Two beds and an altar niche</span></button><button type="button" class="gl-it" style="--ar:1.333" data-lb="8"><img src="/images/groups/a9de499abefc2e1c37f07fab13585f61.webp" alt="Four-bed room" loading="lazy"><span>Four-bed room</span></button><button type="button" class="gl-it" style="--ar:1.333" data-lb="9"><img src="/images/groups/7d3392510158fd2b6d61ff6046bbdbc4.webp" alt="Sitting area in a four-bed room" loading="lazy"><span>Sitting area in a four-bed room</span></button><button type="button" class="gl-it" style="--ar:1.333" data-lb="10"><img src="/images/groups/afae1739e8e836e29c55d0aa386b40d1.webp" alt="Writing desk" loading="lazy"><span>Writing desk</span></button></div><div class="gl-p" data-gp="2"><button type="button" class="gl-it" style="--ar:0.667" data-lb="11"><img src="/images/groups/b48251069d43cd97a817a87d41d8601e.webp" alt="Bathroom in a double room" loading="lazy"><span>Bathroom in a double room</span></button><button type="button" class="gl-it" style="--ar:1.333" data-lb="12"><img src="/images/groups/3886e9433c145c653867c914b1065a2e.webp" alt="Bathroom in a four-bed room" loading="lazy"><span>Bathroom in a four-bed room</span></button><button type="button" class="gl-it" style="--ar:1.333" data-lb="13"><img src="/images/groups/51724293b89e6ef699bd0e92d9079795.webp" alt="Reception, with hand-painted walls" loading="lazy"><span>Reception, with hand-painted walls</span></button><button type="button" class="gl-it" style="--ar:1.778" data-lb="14"><img src="/images/groups/c72427d962e24b8f843c760f2d10d44b.webp" alt="Room key" loading="lazy"><span>Room key</span></button></div><div class="gl-p" data-gp="3"><button type="button" class="gl-it" style="--ar:1.5" data-lb="15"><img src="/images/groups/12acbad10d44b85e9a4cc72a50063447.webp" alt="Rooftop pavilions" loading="lazy"><span>Rooftop pavilions</span></button><button type="button" class="gl-it" style="--ar:0.667" data-lb="16"><img src="/images/groups/0c0ca5111e8f471d6c005bdfe6d5fd17.webp" alt="Carved jali screens" loading="lazy"><span>Carved jali screens</span></button><button type="button" class="gl-it" style="--ar:1.778" data-lb="17"><img src="/images/groups/9345b11f48a3306e76ada8ea70ddaa55.webp" alt="View from the balcony" loading="lazy"><span>View from the balcony</span></button></div></div></div></section><section class="s-cta"><div class="wrap s-cta-g rv"><div><h2 class="caps">Join us<br>for a retreat</h2><p>You can stay in the guesthouse during our retreats. Have a look at the schedule or write to us — we’ll reply within a day.</p></div><div class="s-cta-b"><a class="btn btn-sun" href="/en/#retreats">Our retreats<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a><div class="s-cta-ch"><a class="btn btn-ghost" href="https://wa.me/79250077575" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5l1.4-4A7.5 7.5 0 1 1 8.6 19z"/><path d="M9 10.5h6M9 13.5h4"/></svg>WhatsApp</a><a class="btn btn-ghost" href="https://t.me/+79250077575" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4L3 11l6.5 2.5L12 20l3-5 4.5 3z"/><path d="M9.5 13.5L21 4"/></svg>Telegram</a><a class="btn btn-ghost" href="mailto:info@rupasev
