idth="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".8"/></svg></span><small>Instagram</small><b>@sri_rupa_seva_kunj</b></a></div></div></section><section class="sec ct-mp"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>On the map</p><h2 class="caps">Govardhan,<br>Aanyor village</h2></div><div><p class="lead">The simplest way is to type “Sri Rupa Seva Kunj” into Google Maps.</p><div class="sv-b"><a class="btn btn-sun" href="https://maps.app.goo.gl/bTU8N66GqsZw3UwB7" target="_blank" rel="noopener">Open in Google Maps<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a></div></div></div><div class="ct-map rv"><img src="/images/groups/e4e005df529e5ca0b9cb909af685d9b3.jpg" alt="Map: Govardhan, Aanyor and the ashram" loading="lazy"><span class="ct-pin" style="left:52.7%;top:84%"><i></i><b>Sri Rupa Seva Kunj</b></span><small class="ct-osm">© OpenStreetMap contributors</small></div><div class="ct-addr rv"><div><small>Postal address</small><b>Sri Rupa Seva Kunj, Govardhan Parikrama Marg, Aanyor, Uttar Pradesh 281502</b></div><button type="button" class="bc-cp" data-copy="Sri Rupa Seva Kunj, Govardhan Parikrama Marg, Aanyor, Uttar Pradesh 281502">Copy</button></div></div></section><section class="sec ct-rt"><div class="wrap"><div class="head rv"><div><p class="eb"><i></i>Getting here</p><h2 class="caps">On foot<br>and by car</h2></div><div><p class="lead">Flying into Delhi? We can help arrange a transfer to the ashram — just let us know in advance.</p></div></div><div class="ct-rg rv"><article class="ct-r"><span class="ct-r-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4.5" r="1.8"/><path d="M10 21l2-6 2.5 2.5V21M8 12l2.5-4.5 3 1.2 2 3.3M7 16l3-6"/></svg></span><h3>On foot</h3><small>along the parikrama path</small><ol><li>Follow the parikrama path from Dan Ghati into the village of Aanyor.</li><li>After about 300 meters, take the turn on the left.</li><li>Go straight for about 400 meters, and you’ll be at our gates.</li></ol></article><article class="ct-r"><span class="ct-r-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16V11l2-5h10l2 5v5M5 16h14M5 16v2M19 16v2"/><circle cx="8" cy="13.5" r="1"/><circle cx="16" cy="13.5" r="1"/></svg></span><h3>By car</h3><small>via the Bypass Road</small><ol><li>Don’t try to drive along the parikrama path — it’s easy to get stuck in the narrow lanes for a long time.</li><li>Take the Bypass Road instead. If you’re coming from Vrindavan, the turn onto it is just before Radha-kunda.</li><li>Drive past the turn for Sri Radha Brij Vasundhara. You want the next turn, about a kilometer further on.</li><li>Turn right, drive exactly one kilometer, and you’re home.</li></ol></article><figure class="ct-sign"><button type="button" class="gi-ph " data-lb="0" aria-label="The sign to the ashram at the turn — open"><img src="/images/groups/b26e2a768276ad7436a557a368e75a32.jpg" alt="The sign to the ashram at the turn" loading="lazy"></button><figcaption>Look out for this sign</figcaption></figure></div></div></section><section class="sec gi-nx"><div class="wrap"><p class="eb rv"><i></i>Our projects</p><div class="gi-nx-g"><a class="gi-nx-c rv" href="/en/mandir"><span><img src="/images/groups/9ae4918fbf0a251da9bcd6f68d3e69db.jpg" alt="" loading="lazy"></span><b>Radha-Govinda Temple</b><small>Opening on Radhashtami</small></a><a class="gi-nx-c rv" href="/en/brajcare"><span><img src="/images/groups/0da0101c0a5cfea2ccaf0d53f469d313.jpg" alt="" loading="lazy"></span><b>BrajCare</b><small>Helping you serve Vraja</small></a><a class="gi-nx-c rv" href="/en/vedarama"><span><img src="/images/groups/1c3c586faa8b8c548413843a7adcc622.jpg" alt="" loading="lazy"></span><b>Vedarama</b><small>A digital library</small></a><a class="gi-nx-c rv" href="/en/bhajanamrita"><span><img src="/images/groups/e4f5e7d1188aa405f2e5dae6ace47030.jpg" alt="" loading="lazy"></span><b>Bhajanamrita</b><small>Bhajans with translations</small></a></div></div></section></main><footer class="sf" id="contacts"><div class="wrap hm-verse"><p>nija-nikaṭa-nivāsaṁ dehi govardhana tvam</p><span>O Govardhan, please grant me a home close to You…</span></div><div class="wrap sf-g"><a class="sf-logo" href="/en/#top" aria-label="Home"><svg class="lg lg4" viewBox="0 0 328 400" role="img" aria-label="Sri Rupa Seva Kunj"><title>Sri Rupa Seva Kunj</title><g transform="translate(0 0)"> <path d="M45.4997 68.3784C45.4997 64.8061 44.4258 61.8591 42.3077 59.5966C40.1599 57.3342 37.5048 55.3397 34.283 53.5834C31.0612 51.8271 27.6008 50.1898 23.8122 48.6418C20.0534 47.0939 16.5631 45.2482 13.3413 43.0751C10.1494 40.902 7.46454 38.1931 5.31667 35.0078C3.16881 31.7928 2.09487 27.7145 2.09487 22.7729C2.09487 15.7773 4.54105 10.2106 9.40359 6.13232C14.3258 2.05403 21.2467 0 30.226 0C35.4465 0 40.1897 0.386991 44.4854 1.16097C48.7513 1.93496 52.0924 2.91732 54.5088 4.10806L51.287 13.5745C49.3181 12.5921 46.4245 11.6693 42.6359 10.806C38.8174 9.91293 34.5217 9.4664 29.7487 9.4664C24.1105 9.4664 19.8744 10.7167 17.0404 13.247C14.2065 15.7773 12.8044 18.7244 12.8044 22.1478C12.8044 25.5712 13.8783 28.2504 16.0262 30.483C18.174 32.7156 20.829 34.6804 24.0508 36.4367C27.2726 38.1931 30.7331 39.9196 34.5217 41.6164C38.2805 43.3132 41.7708 45.3077 44.9926 47.5701C48.2144 49.8326 50.8694 52.5415 53.0172 55.697C55.1651 58.8524 56.239 62.7819 56.239 67.4853C56.239 71.3255 55.5529 74.7786 54.1806 77.8448C52.8084 80.9109 50.8097 83.5603 48.1547 85.793C45.4997 88.0256 42.3077 89.7224 38.5191 90.9132C34.7604 92.1039 30.4646 92.6993 25.6916 92.6993
